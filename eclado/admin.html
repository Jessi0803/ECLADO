// ─── CATALOG (商品 & 庫存 合併) ───────────────────────────────────────────────
const PRODUCT_CATEGORIES = ['清潔', '精華液', '急救安瓶', '面膜', '眼霜', '面霜'];
const MAX_PRODUCT_IMAGE_BYTES = 2 * 1024 * 1024;

function Catalog({ products, setProducts, onCreateProduct, onArchiveProduct, onRestoreProduct }) {
  const [stockEditId, setStockEditId] = useState(null);
  const [stockVal, setStockVal] = useState('');
  const [editing, setEditing] = useState(null); // product being edited (draft copy)
  const [listMode, setListMode] = useState('active');
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const activeProducts = products.filter(p => p.active !== false);
  const archivedProducts = products.filter(p => p.active === false);
  const shownProducts = listMode === 'archived' ? archivedProducts : activeProducts;
  const lowStock = activeProducts.filter(p => p.stock <= p.minStock);

  const lbl = { fontSize: 11, letterSpacing: '0.1em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 6 };
  const inp = { width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '8px 0', fontSize: 13, background: 'none', color: 'var(--dark)', outline: 'none', boxSizing: 'border-box' };
  const ta  = { ...inp, resize: 'vertical', minHeight: 72, padding: '6px 0' };

  function saveStock(id) {
    const val = parseInt(stockVal);
    if (!isNaN(val) && val >= 0) {
      setProducts(prev => prev.map(p => p.id === id ? { ...p, stock: val } : p));
    }
    setStockEditId(null);
  }

  function openEdit(p) {
    setError('');
    setEditing({ ...p });
  }

  function openNew() {
    setError('');
    setEditing({
      id: null,
      name: '',
      nameZh: '',
      category: PRODUCT_CATEGORIES[0],
      size: '',
      price: 0,
      proPrice: 0,
      stock: 0,
      minStock: 3,
      isProOnly: false,
      img: '',
      desc: '',
      skinType: '',
      ingredients: '',
      features: [],
      active: true,
      isNew: true,
    });
  }

  function setF(field) {
    return e => setEditing(prev => ({ ...prev, [field]: e.target.value }));
  }

  async function setImageFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setError('');
    if (!file.type.startsWith('image/')) {
      setError('請選擇圖片檔案');
      return;
    }
    if (file.size > MAX_PRODUCT_IMAGE_BYTES) {
      setError('圖片大小不可超過 2 MB');
      return;
    }
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('read failed'));
      reader.readAsDataURL(file);
    }).catch(() => null);
    if (!dataUrl) {
      setError('圖片讀取失敗，請重新選擇');
      return;
    }
    setEditing(prev => ({ ...prev, img: dataUrl }));
  }

  async function saveEdit() {
    setError('');
    if (!editing.nameZh.trim() || !editing.name.trim() || (editing.isNew && !editing.img.trim())) {
      setError('請輸入中文名稱、英文名稱並選擇商品圖片');
      return;
    }
    const updated = {
      ...editing,
      price: Number(editing.price) || 0,
      proPrice: Number(editing.proPrice) || 0,
      stock: Math.max(0, Number(editing.stock) || 0),
      minStock: Math.max(0, Number(editing.minStock) || 0),
    };
    if (editing.isNew) {
      setSaving(true);
      const saveError = await onCreateProduct(updated);
      setSaving(false);
      if (saveError) {
        setError(saveError);
        return;
      }
      setEditing(null);
      return;
    }
    setProducts(prev => prev.map(p => p.id === updated.id ? updated : p));
    setEditing(null);
  }

  async function archiveProduct(p) {
    if (!confirm(`確定要下架商品「${p.nameZh}」嗎？下架後前台將不顯示此商品。`)) return;
    setError('');
    setSaving(true);
    const archiveError = await onArchiveProduct(p);
    setSaving(false);
    if (archiveError) setError(archiveError);
  }

  async function restoreProduct(p) {
    setError('');
    setSaving(true);
    const restoreError = await onRestoreProduct(p);
    setSaving(false);
    if (restoreError) setError(restoreError);
  }

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}>
          <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 28, fontWeight: 400 }}>商品 & 庫存</h1>
          <span style={{ fontSize: 12, color: 'var(--mid)' }}>{activeProducts.length} 件上架中</span>
          {lowStock.length > 0 && (
            <span style={{ fontSize: 12, color: 'var(--red)', fontWeight: 500 }}>⚠ {lowStock.length} 件庫存不足</span>
          )}
        </div>
        <button onClick={openNew} style={{ padding: '10px 24px', background: 'var(--dark)', color: '#fff', border: 'none', fontSize: 12, letterSpacing: '0.1em', cursor: 'pointer' }}>+ 新增商品</button>
      </div>

      {error && (
        <div style={{ background: 'oklch(0.60 0.18 25 / 0.05)', border: '1px solid oklch(0.60 0.18 25 / 0.2)', padding: '12px 16px', marginBottom: 20, fontSize: 12, color: 'var(--red)' }}>
          {error}
        </div>
      )}

      <div style={{ display: 'flex', gap: 0, marginBottom: 20, border: '1px solid var(--border)', width: 'fit-content', background: 'var(--white)' }}>
        {[['active', `上架中 (${activeProducts.length})`], ['archived', `已下架 (${archivedProducts.length})`]].map(([value, label]) => (
          <button key={value} onClick={() => { setListMode(value); setEditing(null); }} style={{
            padding: '9px 18px', border: 'none', background: listMode === value ? 'var(--dark)' : 'transparent',
            color: listMode === value ? '#fff' : 'var(--mid)', fontSize: 12, cursor: 'pointer',
          }}>{label}</button>
        ))}
      </div>

      {/* Low stock warning */}
      {lowStock.length > 0 && (
        <div style={{ background: 'oklch(0.60 0.18 25 / 0.05)', border: '1px solid oklch(0.60 0.18 25 / 0.2)', padding: '14px 20px', marginBottom: 20 }}>
          <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--red)', marginBottom: 8 }}>⚠ 庫存不足警示 — 以下商品需要補貨</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            {lowStock.map(p => (
              <div key={p.id} style={{ fontSize: 12, background: 'var(--white)', border: '1px solid var(--border)', padding: '5px 12px', display: 'flex', gap: 8, alignItems: 'center' }}>
                <span style={{ color: 'var(--dark)' }}>{p.nameZh}</span>
                <span style={{ fontWeight: 700, color: p.stock === 0 ? 'var(--red)' : 'var(--yellow)' }}>{p.stock} 件</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className={'detail-grid' + (editing ? '' : ' no-panel')}>
        {/* Table */}
        <div>
          <div className="table-scroll" style={{ background: 'var(--white)', border: '1px solid var(--border)' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--off)' }}>
                  {['商品名稱', '分類', '規格', '售價', '專業價', '院線', '庫存', '狀態', '操作'].map(h => (
                    <th key={h} style={{ padding: '12px 14px', textAlign: 'left', fontSize: 11, color: 'var(--mid)', fontWeight: 400, letterSpacing: '0.08em', whiteSpace: 'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {shownProducts.length === 0 && (
                  <tr>
                    <td colSpan={9} style={{ padding: 40, textAlign: 'center', color: 'var(--mid)', fontSize: 13 }}>
                      {listMode === 'archived' ? '目前沒有已下架商品' : '目前沒有上架商品'}
                    </td>
                  </tr>
                )}
                {shownProducts.map(p => {
                  const isLow = p.stock <= p.minStock;
                  const isEditing = editing?.id === p.id;
                  return (
                    <tr key={p.id} style={{ borderBottom: '1px solid var(--border)', background: isEditing ? 'var(--off)' : p.stock === 0 ? 'oklch(0.60 0.18 25 / 0.03)' : 'transparent' }}>
                      <td style={{ padding: '13px 14px' }}>
                        <div style={{ fontSize: 13, fontWeight: 500 }}>{p.nameZh}</div>
                        <div style={{ fontSize: 11, color: 'var(--mid)' }}>{p.name}</div>
                      </td>
                      <td style={{ padding: '13px 14px', fontSize: 12, color: 'var(--mid)' }}>{p.category}</td>
                      <td style={{ padding: '13px 14px', fontSize: 12 }}>{p.size}</td>
                      <td style={{ padding: '13px 14px', fontSize: 12, fontWeight: 500 }}>NT$ {p.price.toLocaleString()}</td>
                      <td style={{ padding: '13px 14px', fontSize: 12, color: 'var(--gold)' }}>NT$ {p.proPrice.toLocaleString()}</td>
                      <td style={{ padding: '13px 14px' }}>
                        <span style={{ fontSize: 11, color: p.isProOnly ? 'var(--dark)' : 'var(--mid)', fontWeight: p.isProOnly ? 600 : 400 }}>
                          {p.isProOnly ? '● 院線' : '○ 一般'}
                        </span>
                      </td>
                      <td style={{ padding: '13px 14px' }}>
                        {stockEditId === p.id ? (
                          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                            <input type="number" value={stockVal} onChange={e => setStockVal(e.target.value)}
                              style={{ width: 60, padding: '4px 8px', border: '1px solid var(--dark)', fontSize: 13, outline: 'none' }}
                              autoFocus
                              onKeyDown={e => { if (e.key === 'Enter') saveStock(p.id); if (e.key === 'Escape') setStockEditId(null); }} />
                            <button onClick={() => saveStock(p.id)} style={{ padding: '4px 8px', background: 'var(--dark)', color: '#fff', border: 'none', fontSize: 11, cursor: 'pointer' }}>✓</button>
                            <button onClick={() => setStockEditId(null)} style={{ padding: '4px 8px', background: 'none', border: '1px solid var(--border)', fontSize: 11, cursor: 'pointer', color: 'var(--mid)' }}>✗</button>
                          </div>
                        ) : (
                          <span style={{ fontSize: 15, fontWeight: 600, color: p.stock === 0 ? 'var(--red)' : isLow ? 'var(--yellow)' : 'var(--dark)' }}>{p.stock}</span>
                        )}
                      </td>
                      <td style={{ padding: '13px 14px' }}>
                        {p.active === false
                          ? <span style={{ fontSize: 11, color: 'var(--mid)', fontWeight: 500 }}>已下架</span>
                          : p.stock === 0
                          ? <span style={{ fontSize: 11, color: 'var(--red)', fontWeight: 500 }}>缺貨</span>
                          : isLow
                            ? <span style={{ fontSize: 11, color: 'var(--yellow)', fontWeight: 500 }}>低庫存</span>
                            : <span style={{ fontSize: 11, color: 'var(--green)', fontWeight: 500 }}>正常</span>}
                      </td>
                      <td style={{ padding: '13px 14px' }}>
                        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                          <button onClick={() => { setStockEditId(p.id); setStockVal(String(p.stock)); }}
                            style={{ padding: '5px 12px', fontSize: 11, background: 'none', border: '1px solid var(--border)', color: 'var(--dark)', cursor: 'pointer' }}>修改庫存</button>
                          <button onClick={() => openEdit(p)}
                            style={{ padding: '5px 12px', fontSize: 11, background: isEditing ? 'var(--dark)' : 'none', border: '1px solid var(--border)', color: isEditing ? '#fff' : 'var(--dark)', cursor: 'pointer' }}>編輯</button>
                          {p.active === false ? (
                            <button onClick={() => restoreProduct(p)} disabled={saving}
                              style={{ padding: '5px 12px', fontSize: 11, background: 'var(--dark)', border: '1px solid var(--dark)', color: '#fff', cursor: saving ? 'not-allowed' : 'pointer', opacity: saving ? 0.6 : 1 }}>重新上架</button>
                          ) : (
                            <button onClick={() => archiveProduct(p)} disabled={saving}
                              style={{ padding: '5px 12px', fontSize: 11, background: 'none', border: '1px solid var(--border)', color: 'var(--mid)', cursor: saving ? 'not-allowed' : 'pointer', opacity: saving ? 0.6 : 1 }}>下架</button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* Edit panel */}
        {editing && (
          <div className="detail-panel" style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: '24px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
              <div>
                <div style={{ fontSize: 10, letterSpacing: '0.14em', color: 'var(--mid)', textTransform: 'uppercase', marginBottom: 4 }}>{editing.isNew ? '新增商品' : '編輯商品'}</div>
                <div style={{ fontSize: 15, fontWeight: 500, color: 'var(--dark)' }}>{editing.nameZh || '新商品'}</div>
              </div>
              <button onClick={() => setEditing(null)} style={{ background: 'none', border: 'none', fontSize: 18, cursor: 'pointer', color: 'var(--mid)', lineHeight: 1, padding: '0 0 0 8px' }}>✕</button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                <div>
                  <label htmlFor="productNameZh" style={lbl}>中文名稱</label>
                  <input id="productNameZh" value={editing.nameZh} onChange={setF('nameZh')} style={inp} />
                </div>
                <div>
                  <label htmlFor="productName" style={lbl}>英文名稱</label>
                  <input id="productName" value={editing.name} onChange={setF('name')} style={inp} />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                <div>
                  <label htmlFor="productCategory" style={lbl}>分類</label>
                  <select id="productCategory" value={editing.category} onChange={setF('category')}
                    style={{ ...inp, cursor: 'pointer' }}>
                    {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label htmlFor="productSize" style={lbl}>規格</label>
                  <input id="productSize" value={editing.size} onChange={setF('size')} style={inp} />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                <div>
                  <label htmlFor="productPrice" style={lbl}>售價 (NT$)</label>
                  <input id="productPrice" type="number" value={editing.price} onChange={setF('price')} style={inp} />
                </div>
                <div>
                  <label htmlFor="productProPrice" style={lbl}>專業價 (NT$)</label>
                  <input id="productProPrice" type="number" value={editing.proPrice} onChange={setF('proPrice')} style={inp} />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                <div>
                  <label htmlFor="productStock" style={lbl}>庫存數量</label>
                  <input id="productStock" type="number" min="0" value={editing.stock} onChange={setF('stock')} style={inp} />
                </div>
                <div>
                  <label htmlFor="productMinStock" style={lbl}>低庫存警示值</label>
                  <input id="productMinStock" type="number" min="0" value={editing.minStock} onChange={setF('minStock')} style={inp} />
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <input type="checkbox" id="isProOnly" checked={editing.isProOnly}
                  onChange={e => setEditing(prev => ({ ...prev, isProOnly: e.target.checked }))}
                  style={{ width: 15, height: 15, cursor: 'pointer' }} />
                <label htmlFor="isProOnly" style={{ fontSize: 13, color: 'var(--dark)', cursor: 'pointer' }}>院線限定（非專業會員不顯示價格）</label>
              </div>

              <div style={{ height: 1, background: 'var(--border)' }} />

              <div>
                <label htmlFor="productImageFile" style={lbl}>上傳商品圖片</label>
                <input id="productImageFile" type="file" accept="image/*" onChange={setImageFile} style={{ ...inp, padding: '8px 0', cursor: 'pointer' }} />
                <p style={{ fontSize: 11, color: 'var(--mid)', marginTop: 6 }}>JPG、PNG、WebP，檔案上限 2 MB</p>
              </div>

              <div>
                <label htmlFor="productImage" style={lbl}>或貼上圖片網址</label>
                <input id="productImage" value={editing.img.startsWith('data:') ? '' : editing.img} onChange={setF('img')} style={inp} placeholder="https://..." />
                {editing.img && (
                  <img src={editing.img} alt={editing.nameZh || '商品圖片預覽'} style={{ width: 84, height: 84, objectFit: 'cover', marginTop: 10, border: '1px solid var(--border)', background: 'var(--off)' }} />
                )}
              </div>

              <div>
                <label htmlFor="productDescription" style={lbl}>商品描述</label>
                <textarea id="productDescription" value={editing.desc} onChange={setF('desc')} style={{ ...ta, minHeight: 96 }} />
              </div>

              <div>
                <label htmlFor="productIngredients" style={lbl}>主要成分</label>
                <textarea id="productIngredients" value={editing.ingredients} onChange={setF('ingredients')} style={{ ...ta, minHeight: 72 }} />
              </div>

              <div>
                <label htmlFor="productSkinType" style={lbl}>適合膚質</label>
                <input id="productSkinType" value={editing.skinType} onChange={setF('skinType')} style={inp} />
              </div>
            </div>

            <div style={{ display: 'flex', gap: 10, marginTop: 24 }}>
              <button onClick={saveEdit} disabled={saving}
                style={{ flex: 1, padding: '12px 0', background: 'var(--dark)', color: '#fff', border: 'none', fontSize: 12, letterSpacing: '0.1em', cursor: saving ? 'not-allowed' : 'pointer', opacity: saving ? 0.7 : 1 }}>
                {saving ? '儲存中…' : editing.isNew ? '建立商品' : '儲存'}
              </button>
              <button onClick={() => setEditing(null)}
                style={{ padding: '12px 20px', background: 'none', border: '1px solid var(--border)', fontSize: 12, color: 'var(--mid)', cursor: 'pointer' }}>
                取消
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── PROMOTIONS ───────────────────────────────────────────────────────────────
function Promotions({ products }) {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null); // null | { ...promo } | 'new'

  async function load() {
    setLoading(true);
    const { data, error } = await supabase
      .from('promotions')
      .select('*')
      .order('created_at', { ascending: false });
    if (!error) setList(data || []);
    setLoading(false);
  }

  useEffect(() => {
    load();
    const ch = supabase
      .channel('promotions-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'promotions' }, load)
      .subscribe();
    return () => { supabase.removeChannel(ch); };
  }, []);

  async function remove(p) {
    if (!confirm(`確定要刪除活動「${p.name}」嗎？此操作無法還原。`)) return;
    await supabase.from('promotions').delete().eq('id', p.id);
  }

  if (editing) {
    return <PromotionForm
      promo={editing === 'new' ? null : editing}
      products={products}
      onClose={() => setEditing(null)}
    />;
  }

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
        <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 28, fontWeight: 400 }}>活動管理</h1>
        <button onClick={() => setEditing('new')} style={{
          padding: '10px 22px', background: 'var(--dark)', color: '#fff',
          border: 'none', fontSize: 12, letterSpacing: '0.12em', cursor: 'pointer',
        }}>+ 新增活動</button>
      </div>

      {loading ? (
        <div style={{ padding: 40, textAlign: 'center', color: 'var(--mid)', fontSize: 13 }}>載入中…</div>
      ) : list.length === 0 ? (
        <div style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: '60px 40px', textAlign: 'center' }}>
          <p style={{ fontSize: 14, color: 'var(--mid)', marginBottom: 16 }}>目前還沒有活動</p>
          <button onClick={() => setEditing('new')} style={{
            padding: '10px 24px', background: 'var(--dark)', color: '#fff',
            border: 'none', fontSize: 12, letterSpacing: '0.12em', cursor: 'pointer',
          }}>建立第一個活動</button>
        </div>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 16 }}>
          {list.map(p => {
            const phase = getPromotionPhase(p);
            const productNames = normProductIds(p)
              .map(id => products.find(x => x.id === id)?.nameZh)
              .filter(Boolean);
            return (
              <div key={p.id} style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: '20px 22px', display: 'flex', flexDirection: 'column', gap: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <h3 style={{ fontSize: 15, fontWeight: 500, color: 'var(--dark)', marginBottom: 6, overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.name}</h3>
                    <PromoBadge phase={phase} />
                  </div>
                </div>

                <div style={{ background: 'var(--off)', padding: '10px 12px', fontSize: 12, color: 'var(--dark)', borderLeft: '2px solid var(--gold)' }}>
                  {getPromotionDiscountOrder(p) === 'amount_then_rate' ? (
                    <>
                      （原價
                      {Number(p.discount_amount) > 0 && <> − <b>NT$ {Number(p.discount_amount).toLocaleString()}</b></>}
                      ） × <b>{p.discount_rate}</b>
                    </>
                  ) : (
                    <>
                      原價 × <b>{p.discount_rate}</b>
                      {Number(p.discount_amount) > 0 && <> − <b>NT$ {Number(p.discount_amount).toLocaleString()}</b></>}
                    </>
                  )}
                </div>

                <div style={{ fontSize: 12, color: 'var(--mid)', lineHeight: 1.6 }}>
                  <div style={{ marginBottom: 4 }}><b style={{ color: 'var(--dark)' }}>{productNames.length}</b> 件參與商品</div>
                  {productNames.length > 0 && (
                    <div style={{ fontSize: 11, color: 'var(--mid)' }}>
                      {productNames.slice(0, 3).join('、')}{productNames.length > 3 ? `…等 ${productNames.length} 件` : ''}
                    </div>
                  )}
                </div>

                {(p.start_at || p.end_at) && (
                  <div style={{ fontSize: 11, color: 'var(--mid)', lineHeight: 1.8, borderTop: '1px solid var(--border)', paddingTop: 10 }}>
                    {p.start_at && <div>上架：{new Date(p.start_at).toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>}
                    {p.end_at && <div>下架：{new Date(p.end_at).toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>}
                  </div>
                )}

                <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                  <button onClick={() => setEditing(p)} style={{
                    flex: 1, padding: '8px', background: 'var(--off)', color: 'var(--dark)',
                    border: '1px solid var(--border)', fontSize: 12, letterSpacing: '0.06em', cursor: 'pointer',
                  }}>編輯</button>
                  <button onClick={() => remove(p)} style={{
                    padding: '8px 14px', background: 'none', color: 'var(--red)',
                    border: '1px solid var(--border)', fontSize: 12, letterSpacing: '0.06em', cursor: 'pointer',
                  }}>刪除</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PromotionForm({ promo, products, onClose }) {
  const [name, setName] = useState(promo?.name || '');
  const [description, setDescription] = useState(promo?.description || '');
  const [productIds, setProductIds] = useState(new Set((promo?.product_ids || []).map(Number)));
  const [rate, setRate] = useState(promo?.discount_rate ?? 0.95);
  const [amount, setAmount] = useState(promo?.discount_amount ?? 1000);
  const [discountOrder, setDiscountOrder] = useState(getPromotionDiscountOrder(promo));
  const [startAt, setStartAt] = useState(promo?.start_at ? promo.start_at.slice(0, 16) : '');
  const [endAt, setEndAt] = useState(promo?.end_at ? promo.end_at.slice(0, 16) : '');
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  function toggleProduct(id) {
    setProductIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }

  async function save(e) {
    e.preventDefault();
    setError('');
    if (!name.trim()) { setError('請輸入活動名稱'); return; }
    if (productIds.size === 0) { setError('請至少選擇一個參與商品'); return; }
    if (startAt && endAt && new Date(startAt).getTime() >= new Date(endAt).getTime()) {
      setError('下架時間必須晚於上架時間');
      return;
    }

    const payload = {
      name: name.trim(),
      description: description.trim() || null,
      product_ids: Array.from(productIds),
      discount_rate: Number(rate),
      discount_amount: Number(amount),
      discount_order: discountOrder,
      start_at: startAt ? new Date(startAt).toISOString() : null,
      end_at: endAt ? new Date(endAt).toISOString() : null,
      active: true,
    };

    setSaving(true);
    const { error } = promo
      ? await supabase.from('promotions').update(payload).eq('id', promo.id)
      : await supabase.from('promotions').insert(payload);
    setSaving(false);

    if (error) {
      if (String(error.message || '').includes('discount_order')) {
        setError('儲存失敗：請先到 Supabase 執行 supabase-promotions-discount-order.sql，更新 promotions 的 discount_order 欄位後再試一次。');
        return;
      }
      setError('儲存失敗：' + error.message);
      return;
    }
    onClose();
  }

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
        <div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--mid)', fontSize: 12, cursor: 'pointer', marginBottom: 6, padding: 0 }}>← 返回活動列表</button>
          <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 28, fontWeight: 400 }}>{promo ? '編輯活動' : '新增活動'}</h1>
        </div>
      </div>

      {error && (
        <div style={{ background: 'oklch(0.60 0.18 25 / 0.08)', border: '1px solid oklch(0.60 0.18 25 / 0.3)', padding: '10px 16px', marginBottom: 20, fontSize: 13, color: 'var(--red)' }}>{error}</div>
      )}

      <form onSubmit={save} style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: 'clamp(20px, 4vw, 32px)', display: 'flex', flexDirection: 'column', gap: 24, maxWidth: 880 }}>
        {/* 活動名稱 */}
        <div>
          <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>活動名稱 *</label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="例：五月慶 95折再折千"
            style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 15, outline: 'none', background: 'none' }} />
        </div>

        {/* 活動說明 */}
        <div>
          <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>活動說明（選填）</label>
          <textarea value={description} onChange={e => setDescription(e.target.value)} rows={2} placeholder="顯示給顧客看的說明文字"
            style={{ width: '100%', border: '1px solid var(--border)', padding: '10px 12px', fontSize: 13, outline: 'none', background: 'var(--off)', resize: 'vertical', fontFamily: 'inherit' }} />
        </div>

        {/* 折扣 */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 20 }}>
          <div>
            <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>折扣率（乘）</label>
            <input type="number" step="0.01" min="0" max="1" value={rate} onChange={e => setRate(e.target.value)}
              style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 15, outline: 'none', background: 'none' }} />
            <p style={{ fontSize: 11, color: 'var(--mid)', marginTop: 4 }}>0.95 = 95 折，1 = 不打折</p>
          </div>
          <div>
            <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>再減金額（NT$）</label>
            <input type="number" step="1" min="0" value={amount} onChange={e => setAmount(e.target.value)}
              style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 15, outline: 'none', background: 'none' }} />
            <p style={{ fontSize: 11, color: 'var(--mid)', marginTop: 4 }}>0 = 不額外減</p>
          </div>
          <div>
            <label htmlFor="promotion-discount-order" style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>折扣計算順序</label>
            <select id="promotion-discount-order" value={discountOrder} onChange={e => setDiscountOrder(e.target.value)}
              style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 15, outline: 'none', background: 'none' }}>
              <option value="rate_then_amount">先打折，再減金額</option>
              <option value="amount_then_rate">先減金額，再打折</option>
            </select>
            <p style={{ fontSize: 11, color: 'var(--mid)', marginTop: 4 }}>新選項會先折抵固定金額，再套用折扣率</p>
          </div>
        </div>

        <div style={{ background: 'var(--off)', padding: '12px 16px', fontSize: 13, color: 'var(--dark)', borderLeft: '2px solid var(--gold)' }}>
          計算公式：
          {discountOrder === 'amount_then_rate' ? (
            <>（活動商品小計 − <b>NT$ {Number(amount).toLocaleString()}</b>） × <b>{rate}</b></>
          ) : (
            <>活動商品小計 × <b>{rate}</b> − <b>NT$ {Number(amount).toLocaleString()}</b></>
          )}
        </div>

        {/* 排程時間 */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 20 }}>
          <div>
            <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>上架時間（選填）</label>
            <input type="datetime-local" value={startAt} onChange={e => setStartAt(e.target.value)}
              style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 14, outline: 'none', background: 'none', color: 'var(--dark)' }} />
            <p style={{ fontSize: 11, color: 'var(--mid)', marginTop: 4 }}>留空表示立即生效</p>
          </div>
          <div>
            <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>下架時間（選填）</label>
            <input type="datetime-local" value={endAt} onChange={e => setEndAt(e.target.value)}
              style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 14, outline: 'none', background: 'none', color: 'var(--dark)' }} />
            <p style={{ fontSize: 11, color: 'var(--mid)', marginTop: 4 }}>留空表示永不自動下架</p>
          </div>
        </div>

        {/* 商品選擇 */}
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12, flexWrap: 'wrap', gap: 8 }}>
            <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase' }}>參與商品 * <span style={{ color: 'var(--dark)', fontWeight: 500 }}>（已選 {productIds.size} 件）</span></label>
            <div style={{ display: 'flex', gap: 12 }}>
              <button type="button" onClick={() => setProductIds(new Set(products.map(p => p.id)))} style={{ background: 'none', border: 'none', color: 'var(--gold)', fontSize: 11, letterSpacing: '0.06em', cursor: 'pointer', padding: 0 }}>全選</button>
              <button type="button" onClick={() => setProductIds(new Set())} style={{ background: 'none', border: 'none', color: 'var(--mid)', fontSize: 11, letterSpacing: '0.06em', cursor: 'pointer', padding: 0 }}>清除</button>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 8, border: '1px solid var(--border)', padding: 12, background: 'var(--off)' }}>
            {products.map(p => {
              const checked = productIds.has(p.id);
              return (
                <label key={p.id} style={{
                  display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', cursor: 'pointer',
                  background: checked ? 'var(--white)' : 'transparent',
                  border: `1px solid ${checked ? 'var(--gold)' : 'transparent'}`,
                  fontSize: 12, color: 'var(--dark)',
                }}>
                  <input type="checkbox" checked={checked} onChange={() => toggleProduct(p.id)} style={{ cursor: 'pointer' }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.nameZh}</div>
                    <div style={{ fontSize: 10, color: 'var(--mid)', marginTop: 2 }}>NT$ {p.price.toLocaleString()}</div>
                  </div>
                </label>
              );
            })}
          </div>
        </div>

        {/* 動作 */}
        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', flexWrap: 'wrap', marginTop: 8 }}>
          <button type="button" onClick={onClose} style={{
            padding: '12px 24px', background: 'none', color: 'var(--mid)',
            border: '1px solid var(--border)', fontSize: 12, letterSpacing: '0.12em', cursor: 'pointer',
          }}>取消</button>
          <button type="submit" disabled={saving} style={{
            padding: '12px 28px', background: saving ? 'var(--mid)' : 'var(--dark)', color: '#fff',
            border: 'none', fontSize: 12, letterSpacing: '0.12em', cursor: saving ? 'wait' : 'pointer',
          }}>{saving ? '儲存中…' : (promo ? '儲存變更' : '建立活動')}</button>
        </div>
      </form>
    </div>
  );
}

// ─── ADMIN GATE ───────────────────────────────────────────────────────────────
const ADMIN_EMAILS = ['baby90522@gmail.com', 'ecladotaiwan@gmail.com'];

function AdminGate({ children }) {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [email, setEmail] = useState('');
  const [pwd, setPwd] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => {
      setSession(data.session);
    });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => {
      setSession(s);
    });
    return () => subscription.unsubscribe();
  }, []);

  async function submit(e) {
    e.preventDefault();
    setLoading(true);
    setError('');
    const { data, error: err } = await supabase.auth.signInWithPassword({ email, password: pwd });
    setLoading(false);
    if (err) { setError('帳號或密碼錯誤'); setPwd(''); return; }
    if (!ADMIN_EMAILS.includes(data.user?.email)) {
      await supabase.auth.signOut();
      setError('此帳號無管理員權限');
      setPwd('');
    }
  }

  async function signOut() {
    await supabase.auth.signOut();
  }

  if (session === undefined) return null; // loading

  const isAdmin = session && ADMIN_EMAILS.includes(session.user?.email);
  if (isAdmin) return React.cloneElement(children, { adminEmail: session.user.email, onSignOut: signOut });

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--sidebar)', padding: 16 }}>
      <form onSubmit={submit} style={{ background: 'var(--white)', padding: 'clamp(32px, 6vw, 48px) clamp(24px, 5vw, 56px)', width: '100%', maxWidth: 380, boxShadow: '0 4px 24px rgba(0,0,0,0.2)' }}>
        <div style={{ textAlign: 'center', marginBottom: 32 }}>
          <div style={{ fontFamily: 'var(--font-d)', fontSize: 22, letterSpacing: '0.22em', color: 'var(--dark)', marginBottom: 6 }}>ECLADO</div>
          <div style={{ fontSize: 10, letterSpacing: '0.24em', color: 'var(--gold)', textTransform: 'uppercase' }}>管理後台 · 請登入</div>
        </div>
        <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>電子郵件</label>
        <input type="email" value={email} onChange={e => { setEmail(e.target.value); setError(''); }} autoFocus required
          style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 15, outline: 'none', background: 'none', color: 'var(--dark)', marginBottom: 20 }}
          onFocus={e => e.target.style.borderBottomColor = 'var(--dark)'}
          onBlur={e => e.target.style.borderBottomColor = 'var(--border)'}
        />
        <label style={{ fontSize: 11, letterSpacing: '0.12em', color: 'var(--mid)', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>密碼</label>
        <input type="password" value={pwd} onChange={e => { setPwd(e.target.value); setError(''); }} required
          style={{ width: '100%', border: 'none', borderBottom: '1px solid var(--border)', padding: '10px 0', fontSize: 15, outline: 'none', background: 'none', color: 'var(--dark)', marginBottom: 8 }}
          onFocus={e => e.target.style.borderBottomColor = 'var(--dark)'}
          onBlur={e => e.target.style.borderBottomColor = 'var(--border)'}
        />
        {error && <p style={{ fontSize: 12, color: 'var(--red)', marginBottom: 8 }}>{error}</p>}
        <button type="submit" disabled={loading} style={{ width: '100%', background: 'var(--dark)', color: '#fff', border: 'none', padding: '14px', fontSize: 12, letterSpacing: '0.18em', cursor: loading ? 'not-allowed' : 'pointer', marginTop: 16, opacity: loading ? 0.7 : 1 }}>
          {loading ? '登入中…' : '進入後台'}
        </button>
      </form>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
// 把 Supabase 欄位（snake_case）轉換為前端用的格式
function normalizeOrder(row) {
  return {
    id: row.id,
    member: row.member,
    type: row.type,
    items: row.items || [],
    total: row.total,
    status: row.status,
    date: row.date,
    address: row.address,
    phone: row.phone,
    email: row.email,
    note: row.note,
    transferLast5: row.transfer_last5,
    tracking: row.tracking,
    user_id: row.user_id,
    subtotal: row.subtotal,
    discount: row.discount || 0,
    promotionName: row.promotion_name,
  };
}

function normalizeProduct(row) {
  return {
    id: row.id,
    name: row.name || '',
    nameZh: row.name_zh || '',
    category: row.category || '',
    size: row.size || '',
    price: Number(row.price) || 0,
    proPrice: Number(row.pro_price) || 0,
    stock: Number(row.stock) || 0,
    minStock: Number(row.min_stock) || 3,
    isProOnly: !!row.is_pro_only,
    img: row.image_url || '',
    desc: row.description || '',
    skinType: row.skin_type || '',
    ingredients: row.ingredients || '',
    features: Array.isArray(row.features) ? row.features : [],
    active: row.active !== false,
  };
}

function productToRow(product) {
  return {
    name: product.name || '',
    name_zh: product.nameZh || '',
    category: product.category || '',
    size: product.size || '',
    price: Number(product.price) || 0,
    pro_price: Number(product.proPrice) || 0,
    stock: Number(product.stock) || 0,
    min_stock: product.minStock === '' || product.minStock == null ? 3 : Math.max(0, Number(product.minStock) || 0),
    is_pro_only: !!product.isProOnly,
    image_url: product.img || null,
    description: product.desc || '',
    skin_type: product.skinType || '',
    ingredients: product.ingredients || '',
    features: Array.isArray(product.features) ? product.features : [],
    active: product.active !== false,
  };
}

// profiles → 會員顯示用格式
function normalizeMember(row, allOrders) {
  const myOrders = allOrders.filter(o => o.user_id === row.id || o.email === row.email);
  return {
    id: row.id,
    name: row.name || (row.email ? row.email.split('@')[0] : '未命名'),
    email: row.email || '',
    phone: row.phone || '',
    type: row.role || 'consumer',
    cert: row.cert || '',
    joined: row.created_at ? row.created_at.slice(0, 10) : '',
    orders: myOrders.length,
    total: myOrders.reduce((s, o) => s + (o.total || 0), 0),
  };
}

function App({ adminEmail, onSignOut }) {
  const [page, setPage] = useState('dashboard');
  const [membersDefaultFilter, setMembersDefaultFilter] = useState('all');
  const [products, setProducts] = useState(INIT_PRODUCTS);
  const [members, setMembers] = useState(INIT_MEMBERS);
  const [orders, setOrders] = useState(INIT_ORDERS);
  const [applications, setApplications] = useState([]);
  const [applicationsLoading, setApplicationsLoading] = useState(true);
  const [applicationsError, setApplicationsError] = useState('');
  const [loadError, setLoadError] = useState('');

  // 從 Supabase 載入訂單 + 會員 + 商品庫存
  async function updateApplicationStatus(id, status) {
    const { error } = await supabase.from('professional_applications').update({ status }).eq('id', id);
    if (error) {
      console.error('update application failed', error);
      return;
    }
    const app = applications.find(a => a.id === id);
    if (app?.user_id) {
      if (status === 'approved') {
        await supabase.from('profiles').update({ role: 'pro' }).eq('id', app.user_id);
      } else if (status === 'rejected') {
        await supabase.from('profiles').update({ role: 'consumer' }).eq('id', app.user_id);
      } else if (status === 'pending') {
        await supabase.from('profiles').update({ role: 'pending' }).eq('id', app.user_id);
      }
    }
    setApplications(prev => prev.map(a => a.id === id ? { ...a, status } : a));
    await fetchAll();
  }

  async function fetchAll() {
    setApplicationsLoading(true);
    try {
      const [ordersRes, profilesRes, productsRes, applicationsRes] = await Promise.all([
        supabase.from('orders').select('*').order('created_at', { ascending: false }),
        supabase.from('profiles').select('*').order('created_at', { ascending: false }),
        supabase.from('products').select('*').order('id', { ascending: true }),
        supabase.from('professional_applications').select('*').order('created_at', { ascending: false }),
      ]);
      if (ordersRes.error) throw ordersRes.error;
      if (profilesRes.error) throw profilesRes.error;

      const realOrders = (ordersRes.data || []).map(normalizeOrder);
      const ids = new Set(realOrders.map(o => o.id));
      const mockExtras = INIT_ORDERS.filter(o => !ids.has(o.id));
      const allOrders = [...realOrders, ...mockExtras];
      setOrders(allOrders);

      const realMembers = (profilesRes.data || []).map(p => normalizeMember(p, allOrders));
      const apps = applicationsRes.error ? [] : (applicationsRes.data || []);

      // 沒對到 profile 的 pending 申請（user_id null 或 user_id 對不到任何 profile）
      // 包成虛擬會員加入列表，讓後台「待審核申請」tab 看得到
      const profileIds = new Set(realMembers.map(m => m.id));
      const orphanMembers = apps
        .filter(a => a.status === 'pending' && (!a.user_id || !profileIds.has(a.user_id)))
        .map(a => ({
          id: `app:${a.id}`,
          name: a.contact_name || '未登入申請',
          email: a.user_email || '',
          phone: a.phone || '',
          type: 'pending',
          cert: a.certificate || '',
          joined: a.created_at ? a.created_at.slice(0, 10) : '',
          orders: 0,
          total: 0,
        }));
      const allMembers = [...realMembers, ...orphanMembers];
      setMembers(allMembers.length > 0 ? allMembers : INIT_MEMBERS);

      if (!productsRes.error) {
        setProducts((productsRes.data || []).map(normalizeProduct));
      }
      if (applicationsRes.error) {
        console.error('applications fetch failed', applicationsRes.error);
        setApplications([]);
        setApplicationsError('無法載入專業申請：' + (applicationsRes.error.message || '請確認已建立 professional_applications 資料表'));
      } else {
        setApplications(apps);
        setApplicationsError('');
      }

      setLoadError(productsRes.error ? '商品庫存尚未連接 Supabase products 表，請先執行 supabase-products.sql；目前顯示本機示範庫存。' : '');
    } catch (err) {
      console.error('fetch failed', err);
      setLoadError('無法連接 Supabase（' + (err.message || '') + '），目前顯示本機示範資料。');
      setApplicationsError('無法載入專業申請資料');
    } finally {
      setApplicationsLoading(false);
    }
  }

  useEffect(() => {
    fetchAll();
    const channel = supabase
      .channel('admin-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'professional_applications' }, () => fetchAll())
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, []);

  // 訂單狀態/托運單號變動時同步到 Supabase
  async function setOrdersWithSync(updater) {
    setOrders(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      next.forEach(o => {
        const old = prev.find(p => p.id === o.id);
        if (old) {
          const update = {};
          if (old.status !== o.status) update.status = o.status;
          if (old.tracking !== o.tracking) update.tracking = o.tracking;
          if (Object.keys(update).length) {
            supabase.from('orders').update(update).eq('id', o.id).then(({ error }) => {
              if (error) console.error('update order failed', error);
            });
          }
        }
      });
      return next;
    });
  }

  // 商品 / 庫存變動時同步到 Supabase products
  async function setProductsWithSync(updater) {
    setProducts(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      next.forEach(product => {
        const old = prev.find(p => p.id === product.id);
        if (old && JSON.stringify(old) !== JSON.stringify(product)) {
          supabase.from('products').update(productToRow(product)).eq('id', product.id).then(({ error }) => {
            if (error) {
              console.error('update product failed', error);
              setLoadError('商品庫存同步失敗：請確認已執行 supabase-products.sql。');
            }
          });
        }
      });
      return next;
    });
  }

  async function createProduct(product) {
    const { data: latestProducts, error: idError } = await supabase
      .from('products')
      .select('id')
      .order('id', { ascending: false })
      .limit(1);
    if (idError) {
      return '新增商品失敗：無法取得商品編號。';
    }
    const nextId = Number(latestProducts?.[0]?.id || 0) + 1;
    const created = { ...product, id: nextId, active: true };
    delete created.isNew;
    const { error } = await supabase.from('products').insert({ id: nextId, ...productToRow(created) });
    if (error) {
      return '新增商品失敗：' + (error.message || '請稍後再試');
    }
    setProducts(prev => [...prev, created].sort((a, b) => a.id - b.id));
    return '';
  }

  async function archiveProduct(product) {
    const { error } = await supabase.from('products').update({ active: false }).eq('id', product.id);
    if (error) {
      return '下架商品失敗：' + (error.message || '請稍後再試');
    }
    setProducts(prev => prev.map(p => p.id === product.id ? { ...p, active: false } : p));
    return '';
  }

  async function restoreProduct(product) {
    const { error } = await supabase.from('products').update({ active: true }).eq('id', product.id);
    if (error) {
      return '重新上架失敗：' + (error.message || '請稍後再試');
    }
    setProducts(prev => prev.map(p => p.id === product.id ? { ...p, active: true } : p));
    return '';
  }

  // 會員角色變動時同步到 Supabase
  async function setMembersWithSync(updater) {
    setMembers(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      next.forEach(m => {
        const old = prev.find(p => p.id === m.id);
        if (old && old.type !== m.type) {
          // 只有真實 Supabase 會員（id 是 uuid）才更新
          if (typeof m.id === 'string' && m.id.length > 20) {
            supabase.from('profiles').update({ role: m.type }).eq('id', m.id).then(({ error }) => {
              if (error) console.error('update role failed', error);
            });
          }
        }
      });
      return next;
    });
  }

  function renderPage() {
    const activeProducts = products.filter(product => product.active !== false);
    switch (page) {
      case 'dashboard': return <Dashboard orders={orders} products={activeProducts} members={members} applications={applications} onGoToPendingMembers={() => { setMembersDefaultFilter('app_pending'); setPage('members'); }} />;
      case 'orders': return <Orders orders={orders} setOrders={setOrdersWithSync} />;
      case 'catalog': return <Catalog products={products} setProducts={setProductsWithSync} onCreateProduct={createProduct} onArchiveProduct={archiveProduct} onRestoreProduct={restoreProduct} />;
      // 舊路徑相容，避免有人記住 /admin#products 之類的
      case 'products':
      case 'inventory': return <Catalog products={products} setProducts={setProductsWithSync} onCreateProduct={createProduct} onArchiveProduct={archiveProduct} onRestoreProduct={restoreProduct} />;
      case 'promotions': return <Promotions products={activeProducts} />;
      case 'members': return <Members members={members} setMembers={setMembersWithSync} orders={orders} applications={applications} applicationsLoading={applicationsLoading} applicationsError={applicationsError} onUpdateApplicationStatus={updateApplicationStatus} defaultFilter={membersDefaultFilter} />;
      case 'applications': return <Members members={members} setMembers={setMembersWithSync} orders={orders} applications={applications} applicationsLoading={applicationsLoading} applicationsError={applicationsError} onUpdateApplicationStatus={updateApplicationStatus} defaultFilter="app_pending" />;
      case 'analytics': return <Analytics />;
      case 'ai': return <AIReorder products={activeProducts} />;
      default: return <Dashboard orders={orders} products={activeProducts} members={members} applications={applications} onGoToPendingMembers={() => { setMembersDefaultFilter('app_pending'); setPage('members'); }} />;
    }
  }

  const [drawerOpen, setDrawerOpen] = useState(false);

  return (
    <div className="app-shell">
      {/* 手機頂部 bar */}
      <div className="mobile-topbar">
        <button onClick={() => setDrawerOpen(true)} style={{
          background: 'none', border: 'none', cursor: 'pointer', padding: 8,
          display: 'flex', flexDirection: 'column', gap: 4,
        }} aria-label="開啟選單">
          <span style={{ display: 'block', width: 22, height: 1.5, background: '#fff' }} />
          <span style={{ display: 'block', width: 16, height: 1.5, background: '#fff' }} />
          <span style={{ display: 'block', width: 22, height: 1.5, background: '#fff' }} />
        </button>
        <div style={{ fontFamily: 'var(--font-d)', fontSize: 14, letterSpacing: '0.2em', color: '#fff' }}>ECLADO</div>
        <div style={{ width: 38 }} />
      </div>

      {/* 手機抽屜遮罩 */}
      {drawerOpen && <div className="mobile-overlay" onClick={() => setDrawerOpen(false)} />}

      <Sidebar page={page} setPage={setPage} open={drawerOpen} onClose={() => setDrawerOpen(false)} adminEmail={adminEmail} onSignOut={onSignOut} />
      <main className="app-main">
        {loadError && (
          <div style={{ background: 'oklch(0.60 0.18 25 / 0.08)', border: '1px solid oklch(0.60 0.18 25 / 0.3)', padding: '10px 16px', marginBottom: 20, fontSize: 12, color: 'var(--red)' }}>
            ⚠ {loadError}
          </div>
        )}
        {renderPage()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AdminGate><App /></AdminGate>
);
</script>
</body>
</html>
