// ─── PROMOTION HELPERS ────────────────────────────────────────────────────────
// 判斷活動是否「進行中」（只依上下架時間）
function normProductIds(p) {
  const raw = p?.product_ids;
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.map(x => Number(x)).filter(n => !Number.isNaN(n));
  if (typeof raw === 'string') {
    try {
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr.map(x => Number(x)).filter(n => !Number.isNaN(n)) : [];
    } catch { return []; }
  }
  return [];
}

function isPromotionLive(p) {
  const now = Date.now();
  if (p?.start_at && new Date(p.start_at).getTime() > now) return false;
  if (p?.end_at && new Date(p.end_at).getTime() < now) return false;
  return true;
}

function getPromotionDiscountOrder(p) {
  return p?.discount_order === 'amount_then_rate' ? 'amount_then_rate' : 'rate_then_amount';
}

function applyPromotionFormula(base, rate, amount, order) {
  const subtotal = Math.max(0, Number(base) || 0);
  const discountRate = Number(rate) || 1;
  const discountAmount = Math.max(0, Number(amount) || 0);
  if (order === 'amount_then_rate') {
    return Math.max(0, (subtotal - discountAmount) * discountRate);
  }
  return Math.max(0, subtotal * discountRate - discountAmount);
}

function getPromotionPhase(p) {
  const now = Date.now();
  if (p?.start_at && new Date(p.start_at).getTime() > now) return 'scheduled';
  if (p?.end_at && new Date(p.end_at).getTime() < now) return 'expired';
  return 'live';
}

// 以 cart 與目前生效的 promotions 計算折扣
// 回傳 { subtotal, discount, finalSubtotal, promotion }
//   subtotal: 商品原小計（依會員角色取對應價）
//   discount: 折抵金額（>=0）
//   finalSubtotal: 商品折扣後小計（不含運費）
//   promotion: 命中的活動物件（沒命中則為 null）
function calculateDiscount(cart, promotions, user) {
  const role = user?.role || (user?.isPro ? 'pro' : 'consumer');
  const multipliers = { pro: 1, instructor: 0.7, distributor: 0.65 };
  const unit = item => multipliers[role] ? Math.round(item.proPrice * multipliers[role]) : item.price;
  const subtotal = cart.reduce((s, i) => s + unit(i) * i.qty, 0);

  if (!Array.isArray(promotions) || promotions.length === 0) {
    return { subtotal, discount: 0, finalSubtotal: subtotal, promotion: null };
  }

  // 取第一個生效中、且購物車裡有它的指定商品的活動（規則：一次只套一個）
  const live = promotions.filter(p => isPromotionLive(p));
  for (const p of live) {
    const ids = new Set(normProductIds(p));
    const promoItems = cart.filter(i => ids.has(Number(i.id)));
    if (promoItems.length === 0) continue;

    const promoSubtotal = promoItems.reduce((s, i) => s + unit(i) * i.qty, 0);
    const rate = Number(p.discount_rate) || 1;
    const amount = Number(p.discount_amount) || 0;
    const afterPromo = applyPromotionFormula(promoSubtotal, rate, amount, getPromotionDiscountOrder(p));
    const discount = Math.round(promoSubtotal - afterPromo);
    return {
      subtotal,
      discount,
      finalSubtotal: subtotal - discount,
      promotion: p,
    };
  }

  return { subtotal, discount: 0, finalSubtotal: subtotal, promotion: null };
}

// ─── ORDERS ───────────────────────────────────────────────────────────────────
function hasPreorder(order) {
  return Array.isArray(order.items) && order.items.some(i => i.fulfillment_type === 'preorder');
}

function Orders({ orders, setOrders }) {
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('awaiting_confirm');
  const [stockFilter, setStockFilter] = useState('all');
  const [trackingInput, setTrackingInput] = useState('');
  const [pushing, setPushing] = useState(false);
  const [lineNotice, setLineNotice] = useState('');

  useEffect(() => {
    setTrackingInput(selected?.tracking || '');
  }, [selected?.id]);

  const byStatus = filter === 'all' ? orders : orders.filter(o => o.status === filter);
  const filtered = stockFilter === 'all' ? byStatus
    : stockFilter === 'preorder' ? byStatus.filter(hasPreorder)
    : byStatus.filter(o => !hasPreorder(o));
  const awaitingCount = orders.filter(o => o.status === 'awaiting_confirm').length;
  const unpaidCount = orders.filter(o => o.status === 'unpaid').length;
  const returnedCount = orders.filter(o => o.status === 'returned').length;
  const preorderCount = byStatus.filter(hasPreorder).length;
  const inStockCount = byStatus.filter(o => !hasPreorder(o)).length;

  async function pushLineOrderNotice(order, type, extra = {}) {
    if (!order?.user_id) {
      setLineNotice('此訂單沒有綁定會員，無法發送 LINE 通知。');
      return false;
    }
    const { data: profile, error } = await supabase
      .from('profiles')
      .select('line_user_id')
      .eq('id', order.user_id)
      .single();
    if (error) {
      setLineNotice('讀取會員 LINE 資料失敗：' + (error.message || '請稍後再試'));
      return false;
    }
    if (!profile?.line_user_id) {
      setLineNotice('此會員沒有 LINE 綁定資料，無法發送 LINE 通知。');
      return false;
    }
    const response = await fetch('/api/line-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type,
        lineUserId: profile.line_user_id,
        orderId: order.id,
        memberName: order.member,
        total: order.total,
        ...extra,
      }),
    }).catch(e => {
      setLineNotice('LINE 通知送出失敗：' + (e.message || '網路錯誤'));
      return null;
    });
    if (!response) return false;
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      setLineNotice('LINE 通知送出失敗：' + (body.error || `HTTP ${response.status}`));
      return false;
    }
    setLineNotice(type === 'payment_paid' ? 'LINE 付款完成通知已送出。' : 'LINE 出貨通知已送出。');
    return true;
  }

  async function updateStatus(id, status) {
    setLineNotice('');
    const order = orders.find(o => o.id === id);
    const shouldNotifyPaid = order && order.status !== 'paid' && status === 'paid';
    const typedTracking = selected?.id === id ? trackingInput.trim() : '';
    const shipmentTracking = order?.tracking || typedTracking;
    const shouldNotifyShipment = order && order.status !== 'shipped' && status === 'shipped';
    const patch = status === 'shipped' && typedTracking ? { status, tracking: typedTracking } : { status };
    setOrders(prev => prev.map(o => o.id === id ? { ...o, ...patch } : o));
    if (selected?.id === id) setSelected(s => ({ ...s, ...patch }));
    if (shouldNotifyPaid) {
      await pushLineOrderNotice({ ...order, status }, 'payment_paid');
    }
    if (shouldNotifyShipment) {
      await pushLineOrderNotice({ ...order, status, tracking: shipmentTracking }, 'shipment', { tracking: shipmentTracking });
    }
  }

  async function confirmShipment() {
    const id = selected.id;
    const tracking = trackingInput.trim();
    setPushing(true);
    setLineNotice('');
    const newStatus = ['paid', 'preparing'].includes(selected.status) ? 'shipped' : selected.status;
    const isNewShipment = newStatus === 'shipped' && selected.status !== 'shipped';
    try {
      setOrders(prev => prev.map(o => o.id === id ? { ...o, status: newStatus, tracking } : o));
      setSelected(s => ({ ...s, status: newStatus, tracking }));
      if (isNewShipment) {
        await pushLineOrderNotice({ ...selected, status: newStatus, tracking }, 'shipment', { tracking });
      }
    } finally {
      setPushing(false);
    }
  }

  return (
    <div className={'detail-grid' + (selected ? '' : ' no-panel')}>
      <div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
          <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 28, fontWeight: 400 }}>訂單管理</h1>
          <div style={{ display: 'flex', gap: 0, border: '1px solid var(--border)', background: 'var(--white)', flexWrap: 'wrap' }}>
            {[['all','全部'], ['awaiting_confirm','轉帳待確認'], ['unpaid','未付款'], ['paid','已付款'], ['preparing','備貨中'], ['shipped','已出貨'], ['delivered','已到貨'], ['returned','退貨']].map(([val, label]) => (
              <button key={val} onClick={() => setFilter(val)} style={{
                padding: '8px 16px', border: 'none', fontSize: 12, letterSpacing: '0.04em',
                background: filter === val ? 'var(--dark)' : 'transparent',
                color: filter === val ? '#fff' : 'var(--mid)',
                cursor: 'pointer', transition: 'all 0.15s', position: 'relative',
                display: 'flex', alignItems: 'center', gap: 6,
              }}>
                {label}
                {val === 'awaiting_confirm' && awaitingCount > 0 && (
                  <span style={{
                    background: 'var(--red)', color: '#fff', fontSize: 10, fontWeight: 600,
                    minWidth: 18, height: 18, borderRadius: 9, padding: '0 6px',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1,
                  }}>{awaitingCount}</span>
                )}
                {val === 'unpaid' && unpaidCount > 0 && (
                  <span style={{
                    background: 'oklch(0.65 0.18 50)', color: '#fff', fontSize: 10, fontWeight: 600,
                    minWidth: 18, height: 18, borderRadius: 9, padding: '0 6px',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1,
                  }}>{unpaidCount}</span>
                )}
                {val === 'returned' && returnedCount > 0 && (
                  <span style={{
                    background: 'oklch(0.55 0.12 300)', color: '#fff', fontSize: 10, fontWeight: 600,
                    minWidth: 18, height: 18, borderRadius: 9, padding: '0 6px',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1,
                  }}>{returnedCount}</span>
                )}
              </button>
            ))}
          </div>
        </div>

        {/* 庫存狀態篩選 */}

// ─── INVENTORY ────────────────────────────────────────────────────────────────
function Inventory({ products, setProducts, hideHeader }) {
  const [editId, setEditId] = useState(null);
  const [editVal, setEditVal] = useState('');

  function saveStock(id) {
    const val = parseInt(editVal);
    if (!isNaN(val) && val >= 0) {
      setProducts(prev => prev.map(p => p.id === id ? { ...p, stock: val } : p));
    }
    setEditId(null);
  }

  const lowStock = products.filter(p => p.stock <= p.minStock);

  return (
    <div>
      {!hideHeader && (
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
          <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 28, fontWeight: 400 }}>庫存管理</h1>
          <div style={{ display: 'flex', gap: 10 }}>
            <div style={{ padding: '8px 16px', background: 'var(--white)', border: '1px solid var(--border)', fontSize: 12, color: 'var(--mid)' }}>
              共 {products.length} 件商品
            </div>
            {lowStock.length > 0 && (
              <div style={{ padding: '8px 16px', background: 'oklch(0.60 0.18 25 / 0.08)', border: '1px solid oklch(0.60 0.18 25 / 0.3)', fontSize: 12, color: 'var(--red)', fontWeight: 500 }}>
                ⚠ {lowStock.length} 件庫存不足
              </div>
            )}
          </div>
        </div>
      )}

      {lowStock.length > 0 && (
        <div style={{ background: 'oklch(0.60 0.18 25 / 0.05)', border: '1px solid oklch(0.60 0.18 25 / 0.2)', padding: '16px 20px', marginBottom: 20 }}>
          <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--red)', marginBottom: 10 }}>⚠ 庫存不足警示 — 以下商品需要補貨</div>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            {lowStock.map(p => (
              <div key={p.id} style={{ fontSize: 12, background: 'var(--white)', border: '1px solid var(--border)', padding: '6px 12px', display: 'flex', gap: 8, alignItems: 'center' }}>
                <span style={{ color: 'var(--dark)' }}>{p.nameZh}</span>
                <span style={{ fontWeight: 700, color: p.stock === 0 ? 'var(--red)' : 'var(--yellow)' }}>{p.stock} 件</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="table-scroll" style={{ background: 'var(--white)', border: '1px solid var(--border)' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--off)' }}>
              {['商品名稱', '分類', '規格', '售價', '專業價', '庫存數量', '狀態', '操作'].map(h => (
                <th key={h} style={{ padding: '12px 14px', textAlign: 'left', fontSize: 11, color: 'var(--mid)', fontWeight: 400, letterSpacing: '0.08em', whiteSpace: 'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {products.map(p => {
              const isLow = p.stock <= p.minStock;
              return (
                <tr key={p.id} style={{ borderBottom: '1px solid var(--border)', background: isLow && p.stock === 0 ? 'oklch(0.60 0.18 25 / 0.03)' : 'transparent' }}>
                  <td style={{ padding: '13px 14px' }}>
                    <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--dark)' }}>{p.nameZh}</div>
                    <div style={{ fontSize: 11, color: 'var(--mid)' }}>{p.name}</div>
                  </td>
                  <td style={{ padding: '13px 14px', fontSize: 12, color: 'var(--mid)' }}>{p.category}</td>
                  <td style={{ padding: '13px 14px', fontSize: 12 }}>{p.size}</td>
                  <td style={{ padding: '13px 14px', fontSize: 12 }}>NT$ {p.price.toLocaleString()}</td>
                  <td style={{ padding: '13px 14px', fontSize: 12, color: 'var(--gold)' }}>NT$ {p.proPrice.toLocaleString()}</td>
                  <td style={{ padding: '13px 14px' }}>
                    {editId === p.id ? (
                      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                        <input type="number" value={editVal} onChange={e => setEditVal(e.target.value)} style={{ width: 64, padding: '4px 8px', border: '1px solid var(--dark)', fontSize: 13, outline: 'none' }} autoFocus onKeyDown={e => { if (e.key === 'Enter') saveStock(p.id); if (e.key === 'Escape') setEditId(null); }} />
                        <button onClick={() => saveStock(p.id)} style={{ padding: '4px 10px', background: 'var(--dark)', color: '#fff', border: 'none', fontSize: 11, cursor: 'pointer' }}>✓</button>
                        <button onClick={() => setEditId(null)} style={{ padding: '4px 8px', background: 'none', border: '1px solid var(--border)', fontSize: 11, cursor: 'pointer', color: 'var(--mid)' }}>✗</button>
                      </div>
                    ) : (
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontSize: 16, fontWeight: 600, color: p.stock === 0 ? 'var(--red)' : isLow ? 'var(--yellow)' : 'var(--dark)' }}>{p.stock}</span>
                        <span style={{ fontSize: 11, color: 'var(--mid)' }}>件</span>
                      </div>
                    )}
                  </td>
                  <td style={{ padding: '13px 14px' }}>
                    {p.stock === 0 ? <span style={{ fontSize: 11, color: 'var(--red)', fontWeight: 500 }}>缺貨</span>
                    : isLow ? <span style={{ fontSize: 11, color: 'var(--yellow)', fontWeight: 500 }}>低庫存</span>
                    : <span style={{ fontSize: 11, color: 'var(--green)', fontWeight: 500 }}>正常</span>}
                  </td>
                  <td style={{ padding: '13px 14px' }}>
                    <button onClick={() => { setEditId(p.id); setEditVal(String(p.stock)); }} style={{ padding: '5px 14px', fontSize: 11, background: 'none', border: '1px solid var(--border)', color: 'var(--dark)', cursor: 'pointer', letterSpacing: '0.04em' }}>修改庫存</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── MEMBERS ─────────────────────────────────────────────────────────────────
const APP_STATUS_LABEL = { pending: '待審核', approved: '已核准', rejected: '已拒絕' };
const APP_SOURCE_LABEL = { registration: '註冊申請', upgrade: '事後申請', standalone: '表單申請' };
const APP_STATUS_COLOR = { pending: '#b8860b', approved: '#2e7d32', rejected: '#c62828' };
const APP_STATUS_BG = { pending: '#fff8e1', approved: '#e8f5e9', rejected: '#ffebee' };

function appsForMember(applications, memberId) {
  if (!memberId) return [];
  // 虛擬會員（未綁帳號的申請）：id 格式為 'app:<applicationId>'，直接對 application.id
  if (typeof memberId === 'string' && memberId.startsWith('app:')) {
    const appId = memberId.slice(4);
    return applications.filter(a => a.id === appId);
  }
  return applications
    .filter(a => a.user_id === memberId)
    .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
}

function memberHasPendingApp(applications, memberId) {
  return appsForMember(applications, memberId).some(a => a.status === 'pending');
}

function Members({
  members, setMembers, orders = [],
  applications = [], applicationsLoading = false, applicationsError = '',
  onUpdateApplicationStatus, defaultFilter = 'all',
}) {
  const [filter, setFilter] = useState(defaultFilter);
  const [selected, setSelected] = useState(null);
  const [typeNotice, setTypeNotice] = useState('');

  useEffect(() => { setFilter(defaultFilter); }, [defaultFilter]);

  useEffect(() => {
    if (!selected) return;
    const fresh = members.find(m => m.id === selected.id);
    if (fresh) setSelected(fresh);
  }, [members]);

  const pendingAppCount = applications.filter(a => a.status === 'pending').length;

  const filtered = filter === 'all'
    ? members
    : filter === 'app_pending'
      ? members.filter(m => memberHasPendingApp(applications, m.id) || m.type === 'pending')
      : members.filter(m => m.type === filter);

  const memberOrders = selected
    ? orders.filter(o => o.user_id === selected.id || o.email === selected.email)
    : [];

  const selectedApps = selected ? appsForMember(applications, selected.id) : [];
  const latestApp = selectedApps[0] || null;
  const selectedPending = selected ? memberHasPendingApp(applications, selected.id) : false;

  function changeType(id, type) {
    if (typeof id === 'string' && id.startsWith('app:')) {
      setTypeNotice('此申請尚未綁定會員帳號，請在下方「美容師申請」區塊按「核准」或「拒絕」。');
      return;
    }
    if (type === 'pro' && memberHasPendingApp(applications, id)) {
      setTypeNotice('此會員有審核中的美容師申請，請在下方「美容師申請」區塊按「核准」。');
      return;
    }
    setTypeNotice('');
    setMembers(prev => prev.map(m => m.id === id ? { ...m, type } : m));
    if (selected?.id === id) setSelected(s => ({ ...s, type }));
  }

  async function reviewApplication(appId, status) {
    if (!onUpdateApplicationStatus) return;
    setTypeNotice('');
    await onUpdateApplicationStatus(appId, status);
  }

  return (
    <div className={'detail-grid' + (selected ? '' : ' no-panel')}>
      <div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
          <div>
            <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 28, fontWeight: 400 }}>會員管理</h1>
            {pendingAppCount > 0 && (
              <p style={{ fontSize: 12, color: 'var(--mid)', marginTop: 4 }}>{pendingAppCount} 筆美容師申請待審核</p>
            )}
          </div>
          <div style={{ display: 'flex', gap: 0, border: '1px solid var(--border)', background: 'var(--white)', flexWrap: 'wrap' }}>

// ─── AI REORDER ───────────────────────────────────────────────────────────────
function AIReorder({ products }) {
  const [loading, setLoading] = useState(false);
  const [suggestions, setSuggestions] = useState(null);
  const [expanded, setExpanded] = useState(null);

  async function runAI() {
    setLoading(true);
    setSuggestions(null);

    const productData = products.map(p => {
      const monthly = PRODUCT_MONTHLY[p.id] || [3,4,3,2,5,4];
      const avg = (monthly.reduce((a,b) => a+b, 0) / monthly.length).toFixed(1);
      const trend = monthly[monthly.length-1] > monthly[monthly.length-2] ? '上升' : '持平或下降';
      return `- ${p.nameZh}（${p.size}）：庫存 ${p.stock} 件，近6月平均銷量 ${avg} 件/月，趨勢${trend}`;
    }).join('\n');

    const prompt = `你是一個台灣保養品電商的庫存分析顧問。以下是 ECLADO 韓國醫美院線保養品的庫存與銷售數據：

${productData}

請針對每一件商品，分析並給出：
1. 補貨建議數量（考慮安全庫存與銷售趨勢）
2. 補貨緊急程度（緊急/一般/暫不需要）
3. 簡短理由（1-2句話）

請以 JSON 格式回應，格式如下：
[{"name":"商品名稱","qty":建議數量,"urgency":"緊急/一般/暫不需要","reason":"理由"}]

只回應 JSON，不要其他文字。`;

    try {
      const text = await window.claude.complete(prompt);
      const jsonMatch = text.match(/\[[\s\S]*\]/);
      if (jsonMatch) {
        const data = JSON.parse(jsonMatch[0]);
        setSuggestions(data);
      }
    } catch (e) {
      setSuggestions([{ name: '分析失敗', qty: 0, urgency: '錯誤', reason: '請稍後再試' }]);
    }
    setLoading(false);
  }

  const urgencyColor = { '緊急': 'var(--red)', '一般': 'var(--yellow)', '暫不需要': 'var(--green)' };

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 28 }}>
        <div>
          <h1 style={{ fontFamily: 'var(--font-d)', fontSize: 28, fontWeight: 400, marginBottom: 4 }}>AI 補貨建議</h1>
          <p style={{ fontSize: 13, color: 'var(--mid)' }}>根據銷售趨勢與庫存數量，自動分析補貨需求</p>
        </div>
        <button onClick={runAI} disabled={loading} style={{
          padding: '12px 28px', background: loading ? 'var(--mid)' : 'var(--dark)', color: '#fff', border: 'none',
          fontSize: 13, letterSpacing: '0.1em', cursor: loading ? 'not-allowed' : 'pointer',
          display: 'flex', alignItems: 'center', gap: 10, transition: 'background 0.2s',
        }}>
          {loading ? (
            <>
              <span style={{ display: 'inline-block', width: 14, height: 14, border: '2px solid rgba(255,255,255,0.3)', borderTopColor: '#fff', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
              AI 分析中...
            </>
          ) : (
            <><span>✦</span> 開始 AI 分析</>
          )}
        </button>
      </div>

      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>

      {/* Current stock overview */}
      <div className="product-grid-4" style={{ marginBottom: 28 }}>
        {products.map(p => {
          const monthly = PRODUCT_MONTHLY[p.id] || [3,4,3,2,5,4];
          const avg = (monthly.reduce((a,b) => a+b, 0) / monthly.length).toFixed(1);
          const daysLeft = avg > 0 ? Math.round((p.stock / avg) * 30) : 999;
          return (
            <div key={p.id} style={{ background: 'var(--white)', border: `1px solid ${p.stock <= p.minStock ? 'oklch(0.60 0.18 25 / 0.3)' : 'var(--border)'}`, padding: '16px' }}>
              <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--dark)', marginBottom: 4, lineHeight: 1.4 }}>{p.nameZh}</div>
              <div style={{ fontSize: 11, color: 'var(--mid)', marginBottom: 10 }}>{p.size}</div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
                <div>
                  <div style={{ fontSize: 22, fontFamily: 'var(--font-d)', fontWeight: 400, color: p.stock === 0 ? 'var(--red)' : p.stock <= p.minStock ? 'var(--yellow)' : 'var(--dark)' }}>{p.stock}</div>
                  <div style={{ fontSize: 10, color: 'var(--mid)' }}>件庫存</div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: 12, color: 'var(--dark)' }}>{avg}</div>
                  <div style={{ fontSize: 10, color: 'var(--mid)' }}>件/月均</div>
                </div>
              </div>
              <div style={{ marginTop: 10, fontSize: 11, color: daysLeft < 30 ? 'var(--red)' : 'var(--mid)' }}>
                {daysLeft >= 999 ? '庫存充足' : `約剩 ${daysLeft} 天`}
              </div>
              {/* Mini sparkline */}
              <div style={{ display: 'flex', gap: 2, marginTop: 8, alignItems: 'flex-end', height: 24 }}>
                {monthly.map((v, i) => (
                  <div key={i} style={{ flex: 1, background: i === monthly.length-1 ? 'var(--dark)' : 'var(--light)', height: Math.max(3, (v / Math.max(...monthly)) * 24), borderRadius: 1 }} />
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {/* AI suggestions */}
      {!suggestions && !loading && (
        <div style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: '60px', textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 16, opacity: 0.3 }}>✦</div>
          <p style={{ fontFamily: 'var(--font-d)', fontSize: 22, fontWeight: 300, color: 'var(--dark)', marginBottom: 8 }}>AI 補貨分析</p>
          <p style={{ fontSize: 13, color: 'var(--mid)', marginBottom: 28, lineHeight: 1.7 }}>點擊「開始 AI 分析」，系統將根據您的銷售趨勢<br />與庫存數量，自動生成補貨建議報告</p>
          <button onClick={runAI} style={{ padding: '12px 36px', background: 'var(--dark)', color: '#fff', border: 'none', fontSize: 12, letterSpacing: '0.12em', cursor: 'pointer' }}>✦ 開始分析</button>
        </div>
      )}

      {loading && (
        <div style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: '60px', textAlign: 'center' }}>
          <div style={{ width: 32, height: 32, border: '2px solid var(--light)', borderTopColor: 'var(--dark)', borderRadius: '50%', animation: 'spin 0.8s linear infinite', margin: '0 auto 20px' }} />
          <p style={{ fontSize: 13, color: 'var(--mid)' }}>AI 正在分析銷售數據與庫存狀態...</p>
        </div>
      )}

      {suggestions && (
        <div style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: '28px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
            <h3 style={{ fontSize: 15, fontWeight: 500 }}>AI 分析結果</h3>
            <button onClick={runAI} style={{ padding: '7px 18px', background: 'none', border: '1px solid var(--border)', fontSize: 12, color: 'var(--mid)', cursor: 'pointer', letterSpacing: '0.06em' }}>重新分析</button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {suggestions.map((s, i) => (
              <div key={i} style={{ border: '1px solid var(--border)', padding: '16px 20px', display: 'grid', gridTemplateColumns: '1fr auto auto', gap: 20, alignItems: 'center', cursor: 'pointer', transition: 'background 0.1s', background: expanded === i ? 'var(--off)' : 'transparent' }}
              onClick={() => setExpanded(expanded === i ? null : i)}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>{s.name}</div>
                  {expanded === i && <div style={{ fontSize: 12, color: 'var(--mid)', lineHeight: 1.7, marginTop: 8 }}>{s.reason}</div>}
                </div>
                <div style={{ textAlign: 'center' }}>
                  <div style={{ fontFamily: 'var(--font-d)', fontSize: 24, fontWeight: 400, color: 'var(--dark)' }}>{s.qty}</div>
                  <div style={{ fontSize: 10, color: 'var(--mid)' }}>建議補貨件數</div>
                </div>
                <div>
                  <span style={{ display: 'inline-block', padding: '4px 12px', fontSize: 11, fontWeight: 500, background: (urgencyColor[s.urgency] || 'var(--mid)') + '18', color: urgencyColor[s.urgency] || 'var(--mid)', borderRadius: 2, whiteSpace: 'nowrap' }}>{s.urgency}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
