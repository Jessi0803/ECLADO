/** 首頁／商店頂部：載入中與載入失敗時的提示 */
function PromoDiagnosticBar({ status, errorText }) {
  if (status === 'loading') {
    return (
      <div role="status" style={{ marginTop:68, background:'#f4f3f1', borderBottom:'1px solid var(--light)', padding:'10px 20px', textAlign:'center', fontSize:12, color:'var(--dark)', letterSpacing:'0.04em' }}>
        正在載入優惠活動…
      </div>
    );
  }
  if (status === 'error') {
    return (
      <div role="alert" style={{ marginTop:68, background:'#fef2f2', borderBottom:'1px solid #fecaca', padding:'12px 20px', fontSize:13, color:'#991b1b', lineHeight:1.65, textAlign:'center' }}>
        <strong>優惠活動無法載入</strong>（網站其餘功能仍可使用）。<br />
        <span style={{ fontSize:12, opacity:0.95 }}>{errorText || '未知錯誤'}</span><br />
        <span style={{ fontSize:11, color:'#7f1d1d', marginTop:6, display:'inline-block' }}>
          請到 Supabase 確認已執行 <code style={{ background:'#fee2e2', padding:'1px 6px' }}>eclado/supabase-promotions.sql</code>，且 <strong>public.promotions</strong> 的 RLS 允許 <strong>anon 讀取（SELECT）</strong>。
        </span>
      </div>
    );
  }
  return null;
}

// ─── LINE CALLBACK PAGE ───────────────────────────────────────────────────────
function LineCallbackPage() {
  const [status, setStatus] = useState('LINE 登入中...');
  const [showRetry, setShowRetry] = useState(false);

  useEffect(() => {
    let done = false;
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        done = true;
        const nextLabel = sessionStorage.getItem(CHECKOUT_LOGIN_REDIRECT_KEY) === 'checkout' ? '結帳頁' : '會員專區';
        setStatus('LINE 登入成功，正在前往' + nextLabel + '...');
        return;
      }
    });
    const t = setTimeout(() => {
      if (done) return;
      setStatus('LINE 登入尚未完成，請重新登入或稍後再試。');
      setShowRetry(true);
    }, 8000);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--off-white)' }}>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:13, letterSpacing:'0.1em', color:'var(--dark)' }}>{status}</div>
        {showRetry && (
          <button onClick={() => window.location.href = '/login'} style={{ marginTop:18, background:'var(--black)', color:'var(--white)', border:'none', padding:'12px 24px', fontSize:12, letterSpacing:'0.12em', cursor:'pointer', fontFamily:'var(--font-body)' }}>
            返回登入
          </button>
        )}
      </div>
    </div>
  );
}

// ─── ACCOUNT PAGE ────────────────────────────────────────────────────────────
function AccountPage({ user, setPage, onSignOut }) {
  const isMobile = useIsMobile();
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    if (!user?.uid) return;
    let alive = true;
    async function loadOrders() {
      setLoading(true);
      setError('');
      const { data, error } = await supabase
        .from('orders')
        .select('id, member, items, total, subtotal, discount, status, date, address, tracking, promotion_name, created_at')
        .eq('user_id', user.uid)
        .order('created_at', { ascending: false });
      if (!alive) return;
      if (error) {
        setError('訂單資料無法載入，請稍後再試。');
        setOrders([]);
      } else {
        setOrders(data || []);
      }
      setLoading(false);
    }
    loadOrders();
    return () => { alive = false; };
  }, [user?.uid]);

  if (!user) {
    return (
      <div style={{ minHeight:'100vh', padding:'120px 24px 80px', background:'var(--white)' }}>
        <div style={{ maxWidth:720, margin:'0 auto', textAlign:'center' }}>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize:isMobile ? 30 : 44, fontWeight:300, color:'var(--black)', marginBottom:16 }}>會員專區</h1>
          <p style={{ fontSize:14, color:'var(--dark)', lineHeight:1.8, marginBottom:28 }}>請先登入會員後查看訂單紀錄。</p>
          <button onClick={() => setPage('login')} style={{ background:'var(--black)', color:'var(--white)', border:'none', padding:'14px 30px', fontSize:12, letterSpacing:'0.12em', cursor:'pointer', fontFamily:'var(--font-body)' }}>前往登入</button>
        </div>
      </div>
    );
  }

  const isLineMember = user.email?.startsWith('line.');
  const visibleEmail = isLineMember ? '' : user.email;

  return (
    <div style={{ minHeight:'100vh', paddingTop:68, background:'var(--white)' }}>
      <div style={{ background:'var(--off-white)', borderBottom:'1px solid var(--light)', padding:isMobile ? '42px 20px 30px' : '58px 32px 38px' }}>
        <div style={{ maxWidth:1040, margin:'0 auto' }}>
          <p style={{ fontSize:11, letterSpacing:'0.26em', color:'var(--gold)', textTransform:'uppercase', marginBottom:10 }}>Account</p>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize:isMobile ? 30 : 46, fontWeight:300, color:'var(--black)', marginBottom:12 }}>會員專區</h1>
          <p style={{ fontSize:14, color:'var(--dark)', lineHeight:1.8 }}>您好，{user.name}</p>
        </div>
      </div>

      <div style={{ maxWidth:1040, margin:'0 auto', padding:isMobile ? '32px 20px 72px' : '48px 32px 88px' }}>
        <div style={{ display:'grid', gridTemplateColumns:isMobile ? '1fr' : '280px 1fr', gap:isMobile ? 28 : 40, alignItems:'start' }}>
          <aside style={{ borderTop:'1px solid var(--black)', paddingTop:20 }}>
            <div style={{ fontSize:12, letterSpacing:'0.16em', color:'var(--dark)', textTransform:'uppercase', marginBottom:18 }}>會員資料</div>
            <div style={{ display:'grid', gap:14 }}>
              <div>
                <div style={{ fontSize:11, color:'var(--dark)', marginBottom:4 }}>姓名</div>
                <div style={{ fontSize:15, color:'var(--black)' }}>{user.name}</div>
              </div>
              {visibleEmail && (
                <div>
                  <div style={{ fontSize:11, color:'var(--dark)', marginBottom:4 }}>Email</div>
                  <div style={{ fontSize:13, color:'var(--black)', wordBreak:'break-all' }}>{visibleEmail}</div>
                </div>
              )}
              <div>
                <div style={{ fontSize:11, color:'var(--dark)', marginBottom:4 }}>會員類型</div>
                <div style={{ fontSize:15, color:'var(--black)' }}>{getMemberTier(user).label}</div>
              </div>
              {isAdminUser(user) && (
                <button onClick={openAdmin} style={{ marginTop:8, width:'fit-content', background:'var(--black)', color:'var(--white)', border:'1px solid var(--black)', padding:'10px 18px', fontSize:12, letterSpacing:'0.08em', cursor:'pointer', fontFamily:'var(--font-body)' }}>進入後台</button>
              )}
              <button onClick={onSignOut} style={{ marginTop:8, width:'fit-content', background:'none', color:'var(--dark)', border:'1px solid var(--light)', padding:'10px 18px', fontSize:12, letterSpacing:'0.08em', cursor:'pointer', fontFamily:'var(--font-body)' }}>登出</button>
            </div>
          </aside>

          <section>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:16, marginBottom:22 }}>
              <h2 style={{ fontFamily:'var(--font-display)', fontSize:isMobile ? 24 : 32, fontWeight:300, color:'var(--black)' }}>我的訂單</h2>
              <span style={{ fontSize:12, color:'var(--dark)' }}>{orders.length} 筆</span>
            </div>

            {loading && <div style={{ fontSize:13, color:'var(--dark)', padding:'28px 0', borderTop:'1px solid var(--light)' }}>正在載入訂單...</div>}
            {error && <div style={{ fontSize:13, color:'#991b1b', background:'#fef2f2', border:'1px solid #fecaca', padding:'14px 16px', marginBottom:18 }}>{error}</div>}
            {!loading && !error && orders.length === 0 && (
              <div style={{ borderTop:'1px solid var(--light)', padding:'32px 0' }}>
                <p style={{ fontSize:14, color:'var(--dark)', lineHeight:1.8, marginBottom:18 }}>目前沒有訂單紀錄。</p>
                <button onClick={() => setPage('shop')} style={{ background:'var(--black)', color:'var(--white)', border:'none', padding:'12px 24px', fontSize:12, letterSpacing:'0.12em', cursor:'pointer', fontFamily:'var(--font-body)' }}>前往購物</button>
              </div>
            )}

            <div style={{ display:'grid', gap:14 }}>
              {orders.map(order => {
                const items = Array.isArray(order.items) ? order.items : [];
                return (
                  <div key={order.id} style={{ border:'1px solid var(--light)', padding:isMobile ? 16 : 20, background:'var(--white)' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', gap:16, alignItems:'flex-start', marginBottom:14 }}>
                      <div>
                        <div style={{ fontSize:12, color:'var(--dark)', marginBottom:5 }}>訂單編號</div>
                        <div style={{ fontSize:14, color:'var(--black)', fontWeight:500, wordBreak:'break-all' }}>{order.id}</div>
                      </div>
                      <span style={{ flexShrink:0, fontSize:11, letterSpacing:'0.08em', border:'1px solid var(--gold)', color:'var(--black)', padding:'5px 9px' }}>{getOrderStatusLabel(order.status)}</span>
                    </div>
                    <div style={{ display:'grid', gridTemplateColumns:isMobile ? '1fr' : '1fr auto', gap:isMobile ? 12 : 24, borderTop:'1px solid var(--light)', paddingTop:14 }}>
                      <div style={{ display:'grid', gap:8 }}>
                        {items.map((item, idx) => (
                          <div key={`${order.id}-${idx}`} style={{ display:'flex', justifyContent:'space-between', gap:12, fontSize:13, color:'var(--dark)', lineHeight:1.6 }}>
                            <span>
                              {item.name || item.nameZh || '商品'} × {item.qty || 1}
                              {item.fulfillment && (
                                <span style={{ display:'block', fontSize:12, color: item.fulfillment_type === 'preorder' ? 'var(--gold)' : 'var(--dark)' }}>{item.fulfillment_type === 'loading' ? '庫存資料載入中' : `${item.fulfillment} · ${item.shipping_time || ''}`}</span>
                              )}
                            </span>
                            {item.price != null && <span>NT$ {Number(item.price).toLocaleString()}</span>}
                          </div>
                        ))}
                        {order.promotion_name && <div style={{ fontSize:12, color:'var(--gold)' }}>活動：{order.promotion_name}</div>}
                        {order.tracking && <div style={{ fontSize:12, color:'var(--dark)' }}>物流編號：{order.tracking}</div>}
                      </div>
                      <div style={{ textAlign:isMobile ? 'left' : 'right' }}>
                        <div style={{ fontSize:12, color:'var(--dark)', marginBottom:5 }}>{order.date || order.created_at?.slice(0, 10) || ''}</div>
                        <div style={{ fontFamily:'var(--font-display)', fontSize:20, color:'var(--black)' }}>NT$ {Number(order.total || 0).toLocaleString()}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>
        </div>
      </div>
    </div>
  );
}

      content: `• 會員資料：帳號存續期間，帳號刪除後保留 30 天備份後清除
• 訂單紀錄：依《商業會計法》規定保存 5 年
• 美容師審核文件：審核完成後 30 日內刪除
• 未完成之訂單：超過付款期限後自動取消，相關暫存資料 7 日後清除`,
    },
    {

      content: `依據《個人資料保護法》第 3 條，您對本公司持有之個人資料享有以下權利：

• 查詢或請求閱覽
• 請求製給複製本
• 請求補充或更正
• 請求停止蒐集、處理或利用
• 請求刪除

如欲行使上述權利，請透過 LINE 官方帳號（@ecladotw）或電子郵件提出申請，本公司將於 15 個工作日內回覆。`,
    },
    {
      title: '八、Cookie 政策',
      content: `本網站使用必要性 Cookie 以維持登入狀態及購物車功能。這些 Cookie 僅於瀏覽器工作階段內或依您設定保存，不用於跨網站追蹤或廣告投放。您可透過瀏覽器設定管理 Cookie，但停用可能影響部分功能正常運作。`,
    },
    {
      title: '九、政策修訂',
      content: `本公司得視業務需要或法令修訂而更新本隱私權政策，修訂後版本將於本頁面公告，重大變更將另行以 LINE 或電子郵件通知。繼續使用本網站服務，視為同意修訂後之政策內容。`,
    },
    {
      title: '十、聯絡我們',
      content: `如對本隱私權政策有任何疑問，請透過以下方式與我們聯繫：

• LINE 官方帳號：@ecladotw
• 電子郵件：service@ecladotaiwan.com
• 本政策最後更新日期：2026 年 5 月`,
    },
  ];

  return (
    <div style={{ paddingTop: 68 }}>
      <div style={{ background: 'var(--off-white)', padding: isMobile ? '48px 20px 32px' : '64px 32px 40px', borderBottom: '1px solid var(--light)' }}>
        <div style={{ maxWidth: 860, margin: '0 auto' }}>
          <p style={{ fontSize: 11, letterSpacing: '0.28em', color: 'var(--gold)', textTransform: 'uppercase', marginBottom: 10 }}>Legal</p>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: isMobile ? 30 : 44, fontWeight: 300, color: 'var(--black)', marginBottom: 12 }}>隱私權政策</h1>
          <p style={{ fontSize: 13, color: 'var(--dark)', lineHeight: 1.8 }}>Privacy Policy — 依《個人資料保護法》及國際通用規範訂定</p>
        </div>
      </div>
      <div style={{ maxWidth: 860, margin: '0 auto', padding: isMobile ? '40px 20px 64px' : '60px 32px 80px' }}>
        {sections.map((s, i) => (
          <div key={i} style={{ marginBottom: 40, paddingBottom: 40, borderBottom: i < sections.length - 1 ? '1px solid var(--light)' : 'none' }}>
            <h2 style={{ fontFamily: 'var(--font-display)', fontSize: isMobile ? 17 : 20, fontWeight: 400, color: 'var(--black)', marginBottom: 16 }}>{s.title}</h2>
            <p style={{ fontSize: 14, color: '#555', lineHeight: 2, whiteSpace: 'pre-line' }}>{s.content}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── HISTORY / ROUTING ────────────────────────────────────────────────────────
const PAGE_PATHS = {
  home: '/', shop: '/shop', cart: '/cart', checkout: '/checkout',
  login: '/login', 'pro-login': '/pro-login', 'reset-password': '/reset-password',
  'professional-apply': '/professional-apply', account: '/account', about: '/about', info: '/info',
  'line-callback': '/line-callback', privacy: '/privacy',
};
const PATH_PAGES = Object.fromEntries(Object.entries(PAGE_PATHS).map(([k, v]) => [v, k]));
function pageFromPath(path) {
  const p = path.replace(/\/$/, '') || '/';
  if (p === '/pro-login') return 'login';
  return PATH_PAGES[p] || 'home';
}

function App() {
  const [page, setPageState] = useState(() => {
    if (isPasswordRecoveryUrl()) return 'reset-password';
    if (hasAuthCallbackInUrl() && !isPasswordRecoveryUrl()) {
      return window.location.pathname === '/line-callback' || sessionStorage.getItem(LINE_LOGIN_PENDING_KEY) === '1'
        ? 'line-callback'
        : 'login';
    }
    return pageFromPath(window.location.pathname);
  });

  function setPage(newPage) {
    const path = PAGE_PATHS[newPage] || '/';
    window.history.pushState({ page: newPage }, '', path);
    setPageState(newPage);
  }
  const [user, setUser] = useState(null);
  const [cart, setCart] = useState([]);
  const [products, setProducts] = useState(() => PRODUCTS.map(product => ({ ...product, stock: null })));
  const [promotions, setPromotions] = useState([]);
  const [salesStats, setSalesStats] = useState(emptySalesStats);
  const [promoFetchStatus, setPromoFetchStatus] = useState('loading'); // 先顯示載入中，避免空白誤判
  const [promoFetchError, setPromoFetchError] = useState('');
  const cartCount = cart.reduce((sum,i) => sum+i.qty, 0);

  // 從 profiles 表讀取角色
  async function loadUser(supabaseUser) {
    const { data } = await supabase
      .from('profiles')
      .select('role, line_user_id, name')
      .eq('id', supabaseUser.id)
      .single();

    const displayName = data?.name
      || supabaseUser.user_metadata?.full_name
      || supabaseUser.user_metadata?.name
      || supabaseUser.email?.split('@')[0]
      || 'LINE 用戶';

    setUser({
      name: displayName,
      email: supabaseUser.email || '',
      role: data?.role || 'consumer',
      isPro: data?.role === 'pro',
      uid: supabaseUser.id,
    });
  }

  // 瀏覽器返回 / 前進
  useEffect(() => {
    function onPopState(e) {
      setPageState(e.state?.page || pageFromPath(window.location.pathname));
    }
    window.addEventListener('popstate', onPopState);
    if (!window.history.state?.page && !hasAuthCallbackInUrl()) {
      const p = pageFromPath(window.location.pathname);
      window.history.replaceState({ page: p }, '', window.location.pathname || '/');
    }
    return () => window.removeEventListener('popstate', onPopState);
  }, []);

  // 監聽 Supabase 登入狀態（驗證信 / 重設密碼回傳須先完成 session 交換，再清 URL）
  useEffect(() => {
    let cancelled = false;

    async function finishAuthCallback() {
      if (!hasAuthCallbackInUrl()) return;

      const authErr = getAuthCallbackErrorMessage();
      if (authErr) {
        sessionStorage.removeItem(LINE_LOGIN_PENDING_KEY);
        sessionStorage.setItem('eclado_auth_notice', 'error:' + authErr);
        cleanAuthCallbackFromUrl('/login');
        if (!cancelled) setPageState('login');
        return;
      }

      const { data: { session }, error } = await supabase.auth.getSession();
      if (cancelled) return;

      if (error) {
        sessionStorage.removeItem(LINE_LOGIN_PENDING_KEY);
        sessionStorage.setItem('eclado_auth_notice', 'error:' + sbError(error.message));
        cleanAuthCallbackFromUrl('/login');
        setPageState('login');
        return;
      }

      if (isPasswordRecoveryUrl()) {
        cleanAuthCallbackFromUrl('/reset-password');
        setPageState('reset-password');
        return;
      }

      const isLineLoginCallback = window.location.pathname === '/line-callback'
        || sessionStorage.getItem(LINE_LOGIN_PENDING_KEY) === '1';

      if (session?.user) {
        await loadUser(session.user);
        if (isEmailVerificationCallback()) {
          sessionStorage.setItem('eclado_auth_notice', 'email_verified');
          cleanAuthCallbackFromUrl('/login');
          setPageState('login');
        } else if (isLineLoginCallback) {
          sessionStorage.removeItem(LINE_LOGIN_PENDING_KEY);
          const nextPage = consumeCheckoutLoginRedirectPage();
          cleanAuthCallbackFromUrl(PAGE_PATHS[nextPage] || '/account');
          setPageState(nextPage);
        } else {
          cleanAuthCallbackFromUrl('/login');
          setPageState('login');
        }
      }
    }

    finishAuthCallback();

    supabase.auth.getSession().then(({ data: { session } }) => {
      if (cancelled || hasAuthCallbackInUrl()) return;
      const isPendingLineLogin = window.location.pathname === '/line-callback'
        || sessionStorage.getItem(LINE_LOGIN_PENDING_KEY) === '1';
      if (session?.user) {
        loadUser(session.user);
        if (isPendingLineLogin) {
          sessionStorage.removeItem(LINE_LOGIN_PENDING_KEY);
          const nextPage = consumeCheckoutLoginRedirectPage();
          cleanAuthCallbackFromUrl(PAGE_PATHS[nextPage] || '/account');
          setPageState(nextPage);
        }
      }
    });

    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY' || isPasswordRecoveryUrl()) {
        cleanAuthCallbackFromUrl('/reset-password');
        setPageState('reset-password');
      } else if (event === 'SIGNED_IN' && (window.location.pathname === '/line-callback' || sessionStorage.getItem(LINE_LOGIN_PENDING_KEY) === '1')) {
        if (session?.user) await loadUser(session.user);
        sessionStorage.removeItem(LINE_LOGIN_PENDING_KEY);
        const nextPage = consumeCheckoutLoginRedirectPage();
        cleanAuthCallbackFromUrl(PAGE_PATHS[nextPage] || '/account');
        setPageState(nextPage);
      } else if (event === 'SIGNED_IN' && isEmailVerificationCallback()) {
        if (session?.user) await loadUser(session.user);
        sessionStorage.setItem('eclado_auth_notice', 'email_verified');
        cleanAuthCallbackFromUrl('/login');
        setPageState('login');
      }
      if (session?.user) loadUser(session.user);
      else if (event === 'SIGNED_OUT') setUser(null);
    });

    return () => { cancelled = true; subscription.unsubscribe(); };
  }, []);

  // 載入進行中的活動（含 realtime 同步）
  useEffect(() => {
    if (!window.supabase || typeof window.supabase.from !== 'function') {
      setPromoFetchStatus('error');
      setPromoFetchError('Supabase 未初始化（請重新整理或檢查 script 是否被擋）');
      setPromotions([]);
      return;
    }
    const sb = window.supabase;

    async function loadPromotions() {
      setPromoFetchStatus('loading');
      setPromoFetchError('');
      let { data, error } = await sb.from('promotions').select('*').order('created_at', { ascending: false });
      // 若資料表沒有 created_at 或排序失敗，改不排序再試一次
      if (error) {
        const r2 = await sb.from('promotions').select('*');
        data = r2.data;
        error = r2.error;
      }
      if (error) {
        console.error('[ECLADO] 無法載入 promotions：', error.message, error);
        setPromotions([]);
        setPromoFetchStatus('error');
        setPromoFetchError(error.message || String(error.code || ''));
        return;
      }
      setPromotions(data || []);
      setPromoFetchStatus('ok');
    }
    loadPromotions();
    let ch = null;
    try {
      ch = sb
        .channel('promotions-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'promotions' }, loadPromotions)
        .subscribe();
    } catch (e) {
      console.warn('[ECLADO] Realtime 訂閱失敗（不影響讀取）', e);
    }
    return () => { if (ch) sb.removeChannel(ch); };
  }, []);

  // 載入商品庫存（保留前端既有商品資料，只覆寫 stock）
  useEffect(() => {
    if (!window.supabase || typeof window.supabase.from !== 'function') return;
    const sb = window.supabase;
    let alive = true;

    async function loadProducts() {
      const { data, error } = await sb.from('products').select('id, stock, is_pro_only, price, pro_price, product_list_image_scale, active');
      if (!alive) return;
      if (error) {
        console.error('[ECLADO] 無法載入 products：', error.message, error);
        setProducts(PRODUCTS.map(product => ({ ...product, stock: null })));
        return;
      }
      setProducts(mergeProductsWithStock(PRODUCTS, data || []));
      setCart(prev => prev.map(item => {
        const stockRow = (data || []).find(row => Number(row.id) === Number(item.id));
        return stockRow ? { ...item, stock: Number(stockRow.stock ?? 0) } : item;
      }));
    }

    loadProducts();

    let ch = null;
    try {
      ch = sb
        .channel('products-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, loadProducts)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'product_variants' }, loadProducts)
        .subscribe();
    } catch (e) {
      console.warn('[ECLADO] products Realtime 訂閱失敗（不影響讀取）', e);
    }

    return () => {
      alive = false;
      if (ch) sb.removeChannel(ch);
    };
  }, []);

  // 依已付款/出貨流程中的訂單 items 統計首頁熱門商品。
  useEffect(() => {
    if (!window.supabase || typeof window.supabase.from !== "function") return;
    const sb = window.supabase;
    let alive = true;

    async function loadSalesStats() {
      const { data, error } = await sb
        .from("orders")
        .select("status, items")
        .in("status", Array.from(SALES_COUNTED_STATUSES))
        .limit(1000);
      if (!alive) return;
      if (error) {
        console.warn("[ECLADO] 無法載入熱門商品銷售統計（改用商品清單 fallback）：", error.message || error);
        setSalesStats(emptySalesStats());
        return;
      }
      setSalesStats(buildSalesStats(data || []));
    }

    loadSalesStats();

    let ch = null;
    try {
      ch = sb
        .channel("popular-products-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, loadSalesStats)
        .subscribe();
    } catch (e) {
      console.warn("[ECLADO] popular products Realtime 訂閱失敗（不影響讀取）", e);
    }

    return () => {
      alive = false;
      if (ch) sb.removeChannel(ch);
    };
  }, []);

  // 網址列 #eclado-promotions 時捲到活動區
  useEffect(() => {
    if (window.location.hash !== '#eclado-promotions') return;
    const t = setTimeout(() => {
      document.getElementById('eclado-promotions')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 400);
    return () => clearTimeout(t);
  }, [promotions]);

  function handleSignOut() {
    supabase.auth.signOut();
    setUser(null);
  }

  function renderPage() {
    switch (page) {
      case 'home':     return <HomePage setPage={setPage} user={user} cart={cart} setCart={setCart} promotions={promotions} products={products} salesStats={salesStats} />;
      case 'shop':     return <ShopPage user={user} cart={cart} setCart={setCart} promotions={promotions} products={products} salesStats={salesStats} />;
      case 'cart':     return <CartPage cart={cart} setCart={setCart} setPage={setPage} user={user} promotions={promotions} />;
      case 'checkout': return <CheckoutPage cart={cart} setCart={setCart} setPage={setPage} user={user} promotions={promotions} />;
      case 'login':    return <LoginPage setPage={setPage} />;
      case 'pro-login': return <LoginPage setPage={setPage} />;
      case 'reset-password': return <ResetPasswordPage setPage={setPage} />;
      case 'professional-apply': return <ProfessionalApplicationPage setPage={setPage} user={user} />;
      case 'account':  return <AccountPage user={user} setPage={setPage} onSignOut={handleSignOut} />;
      case 'about':    return <AboutPage />;
      case 'info':     return <InfoPage />;
      case 'line-callback': return <LineCallbackPage />;
      case 'privacy':  return <PrivacyPage />;
      default:         return <HomePage setPage={setPage} user={user} cart={cart} setCart={setCart} promotions={promotions} products={products} salesStats={salesStats} />;
    }
  }

  const authPage = page === 'login' || page === 'pro-login' || page === 'reset-password' || page === 'line-callback';
  const showPromoBar = !authPage;

  return (
    <>
      {!authPage && <Nav setPage={setPage} cartCount={cartCount} user={user} setUser={handleSignOut} page={page} />}
      {showPromoBar && (
        <PromoDiagnosticBar status={promoFetchStatus} errorText={promoFetchError} />
      )}
      {renderPage()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
