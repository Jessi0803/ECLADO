const PRODUCT_IMAGE_BOUNDS_CACHE = new Map();

function getImageAnalysisSrc(src) {
  const match = String(src || '').match(/drive\.google\.com\/thumbnail\?id=([^&]+)/);
  return match ? 'https://lh3.googleusercontent.com/d/' + match[1] + '=w1000' : src;
}

function analyzeTransparentImageBounds(src) {
  const analysisSrc = getImageAnalysisSrc(src);
  if (!analysisSrc) return Promise.resolve(null);
  if (PRODUCT_IMAGE_BOUNDS_CACHE.has(analysisSrc)) return PRODUCT_IMAGE_BOUNDS_CACHE.get(analysisSrc);
  const task = new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const naturalWidth = img.naturalWidth || img.width;
        const naturalHeight = img.naturalHeight || img.height;
        if (!naturalWidth || !naturalHeight) return resolve(null);
        const maxScanSize = 360;
        const ratio = Math.min(1, maxScanSize / Math.max(naturalWidth, naturalHeight));
        const width = Math.max(1, Math.round(naturalWidth * ratio));
        const height = Math.max(1, Math.round(naturalHeight * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, width, height);
        const pixels = ctx.getImageData(0, 0, width, height).data;
        let left = width, right = -1, top = height, bottom = -1, transparentPixels = 0;
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const alpha = pixels[(y * width + x) * 4 + 3];
            if (alpha < 12) transparentPixels++;
            if (alpha > 12) {
              if (x < left) left = x;
              if (x > right) right = x;
              if (y < top) top = y;
              if (y > bottom) bottom = y;
            }
          }
        }
        if (right < left || transparentPixels < width * height * 0.02) return resolve(null);
        resolve({
          naturalWidth,
          naturalHeight,
          left: left / ratio,
          top: top / ratio,
          width: (right - left + 1) / ratio,
          height: (bottom - top + 1) / ratio,
        });
      } catch {
        resolve(null);
      }
    };
    img.onerror = () => resolve(null);
    img.src = analysisSrc;
  });
  PRODUCT_IMAGE_BOUNDS_CACHE.set(analysisSrc, task);
  return task;
}

function ProductAutoImage({ src, alt, product, mode, style }) {
  const imgRef = useRef(null);
  const manualScale = mode === 'list' ? normalizeProductImageScale(product?.listImageScale) : null;
  const fallbackScale = manualScale || getDefaultProductImageScale(product);
  const [fit, setFit] = useState({ scale: fallbackScale, x: 0, y: 0 });

  useEffect(() => {
    let cancelled = false;
    setFit({ scale: fallbackScale, x: 0, y: 0 });
    if (manualScale) return;
    analyzeTransparentImageBounds(src).then(bounds => {
      const el = imgRef.current;
      if (cancelled || !bounds || !el) return;
      const frameWidth = el.clientWidth;
      const frameHeight = el.clientHeight;
      if (!frameWidth || !frameHeight) return;
      const containScale = Math.min(frameWidth / bounds.naturalWidth, frameHeight / bounds.naturalHeight);
      const productWidth = bounds.width * containScale;
      const productHeight = bounds.height * containScale;
      const targetSize = Math.min(frameWidth, frameHeight) * (PRODUCT_AUTO_IMAGE_TARGETS[mode] || 0.8);
      const scale = Math.max(0.45, Math.min(2.4, targetSize / Math.max(productWidth, productHeight)));
      const drawnWidth = bounds.naturalWidth * containScale;
      const drawnHeight = bounds.naturalHeight * containScale;
      const drawnLeft = (frameWidth - drawnWidth) / 2;
      const drawnTop = (frameHeight - drawnHeight) / 2;
      const productCenterX = drawnLeft + (bounds.left + bounds.width / 2) * containScale;
      const productCenterY = drawnTop + (bounds.top + bounds.height / 2) * containScale;
      setFit({ scale, x: frameWidth / 2 - productCenterX, y: frameHeight / 2 - productCenterY });
    });
    return () => { cancelled = true; };
  }, [src, mode, manualScale, fallbackScale]);

  return (
    <img
      ref={imgRef}
      src={src}
      alt={alt}
      style={{ ...style, transform:'translate(' + fit.x + 'px, ' + fit.y + 'px) scale(' + fit.scale + ')', transformOrigin:'center center' }}
    />
  );
}

function groupProductVariants(rows) {
  return (rows || []).reduce((map, row) => {
    const productId = Number(row.product_id);
    if (!productId) return map;
    const variant = normalizeProductVariant({
      id: row.id || row.sku || row.size,
      size: row.size,
      price: row.price,
      proPrice: row.pro_price,
      stock: row.stock,
      isDefault: row.is_default,
    });
    if (!map.has(productId)) map.set(productId, []);
    map.get(productId).push(variant);

function getFulfillmentInfo(product) {

function mergeProductsWithStock(baseProducts, stockRows) {
  const rowMap = new Map((stockRows || []).map(row => [Number(row.id), row]));
  return baseProducts.map(product => {

    if (!row) return { ...product, stock: null };
    return {
      ...product,
      stock: Number(row.stock ?? 0),
      isProOnly: row.is_pro_only != null ? !!row.is_pro_only : product.isProOnly,
      price: row.price != null ? Number(row.price) : product.price,
      proPrice: row.pro_price != null ? Number(row.pro_price) : product.proPrice,
      listImageScale: normalizeProductImageScale(row.product_list_image_scale ?? product.listImageScale),
      active: row.active != null ? row.active : product.active,
    };
  });
}


const SALES_COUNTED_STATUSES = new Set(["paid", "preparing", "shipped", "delivered"]);
const DEFAULT_POPULAR_PRODUCT_LIMIT = 8;

function normalizeSalesName(value) {
  return String(value || "").replace(/\s+/g, "").toLowerCase();
}

function emptySalesStats() {
  return { byId: {}, byName: {} };
}

function buildSalesStats(orders) {
  const byId = {};
  const byName = {};

  (orders || []).forEach(order => {
    if (!SALES_COUNTED_STATUSES.has(order?.status)) return;
    const items = Array.isArray(order.items) ? order.items : [];
    items.forEach(item => {
      const qty = Math.max(1, Number(item?.qty) || 1);
      const productId = Number(item?.product_id ?? item?.productId ?? item?.id);
      if (!Number.isNaN(productId) && productId > 0) {
        byId[productId] = (byId[productId] || 0) + qty;
        return;
      }
      const name = normalizeSalesName(item?.name || item?.nameZh || item?.name_zh);
      if (name) byName[name] = (byName[name] || 0) + qty;
    });
  });

  return { byId, byName };
}

function getProductSalesCount(product, salesStats) {
  const idCount = Number(salesStats?.byId?.[Number(product.id)] || 0);
  const names = [product.nameZh, product.name, product.name_zh].map(normalizeSalesName).filter(Boolean);
  const nameCount = names.reduce((sum, name) => sum + Number(salesStats?.byName?.[name] || 0), 0);
  return idCount + nameCount;
}

function getPopularProducts(products, salesStats, limit = DEFAULT_POPULAR_PRODUCT_LIMIT) {
  const ranked = (products || [])
    .filter(product => product && product.active !== false)
    .map((product, index) => ({
      product,
      index,
      sales: getProductSalesCount(product, salesStats),
    }));

  const sold = ranked
    .filter(item => item.sales > 0)
    .sort((a, b) => b.sales - a.sales || a.index - b.index);
  const fallback = ranked.filter(item => item.sales <= 0);

  return [...sold, ...fallback].slice(0, limit).map(item => item.product);
}

// ─── PROMOTION HELPERS ────────────────────────────────────────────────────────
// Supabase integer[] 有時是數字、有時是字串，統一成數字 id
function normProductIds(p) {
  const raw = p?.product_ids;
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.map(x => Number(x)).filter(n => !Number.isNaN(n));
  if (typeof raw === 'string') {
    try {
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr.map(x => Number(x)).filter(n => !Number.isNaN(n)) : [];
    } catch { return []; }
  }
  return [];
}

function isPromotionLive(p) {
  const now = Date.now();
  if (p?.start_at && new Date(p.start_at).getTime() > now) return false;
  if (p?.end_at && new Date(p.end_at).getTime() < now) return false;
  return true;
}

function getPromotionDiscountOrder(p) {
  return p?.discount_order === 'amount_then_rate' ? 'amount_then_rate' : 'rate_then_amount';
}

function applyPromotionFormula(base, rate, amount, order) {
  const subtotal = Math.max(0, Number(base) || 0);
  const discountRate = Number(rate) || 1;
  const discountAmount = Math.max(0, Number(amount) || 0);
  if (order === 'amount_then_rate') {
    return Math.max(0, (subtotal - discountAmount) * discountRate);
  }
  return Math.max(0, subtotal * discountRate - discountAmount);
}

// 用購物車與目前生效的活動，回傳折扣計算結果
function calculateDiscount(cart, promotions, user) {
  const unit = item => getMemberPrice(item, user);
  const subtotal = cart.reduce((s, i) => s + unit(i) * i.qty, 0);

  if (!Array.isArray(promotions) || promotions.length === 0) {
    return { subtotal, discount: 0, finalSubtotal: subtotal, promotion: null };
  }
  const live = promotions.filter(p => isPromotionLive(p));
  for (const p of live) {
    const ids = new Set(normProductIds(p));
    const promoItems = cart.filter(i => ids.has(Number(i.id)));
    if (promoItems.length === 0) continue;
    const promoSubtotal = promoItems.reduce((s, i) => s + unit(i) * i.qty, 0);
    const rate = Number(p.discount_rate) || 1;
    const amount = Number(p.discount_amount) || 0;
    const afterPromo = applyPromotionFormula(promoSubtotal, rate, amount, getPromotionDiscountOrder(p));
    const discount = Math.round(promoSubtotal - afterPromo);
    return { subtotal, discount, finalSubtotal: subtotal - discount, promotion: p };
  }
  return { subtotal, discount: 0, finalSubtotal: subtotal, promotion: null };
}

// 計算單一商品的活動顯示價（回傳 { price, label, promo } 或 null）
function getPromoDisplayPrice(product, user, promotions) {
  const basePrice = getMemberPrice(product, user);
  const live = (promotions || []).filter(p => isPromotionLive(p) && normProductIds(p).includes(Number(product.id)));
  if (!live.length) return null;
  const p = live[0];
  const rate = Number(p.discount_rate) || 1;
  const amount = Number(p.discount_amount) || 0;
  const discounted = Math.round(applyPromotionFormula(basePrice, rate, amount, getPromotionDiscountOrder(p)));
  if (discounted >= basePrice) return null;
  const parts = [];
  if (rate < 1) parts.push(`${Math.round(rate * 10)}折`);
  if (amount > 0) parts.push(`−NT$ ${amount.toLocaleString()}`);
  return { price: discounted, label: parts.join(' + '), promo: p };
}

function extractPaymentLink(response) {
  if (!response || typeof response !== 'object') return '';

    response.RedirectURL,
    response.PaymentURL,
    response?.CardParam?.CardPayURL,
    response?.CardParam?.CardURL,
    response?.MobileParam?.MobilePayURL,

    response?.WalletParam?.WalletPayURL,
    response?.WalletParam?.WalletURL,
    response.WebAtmURL,
    response?.ATMParam?.WebAtmURL,
  ];
  return candidates.find(url => typeof url === 'string' && url.startsWith('http') && !url.includes('QRCode')) || '';

  if (!response || typeof response !== 'object') return '';
  const candidates = [
    response.PayToken,
    response?.CardParam?.PayToken,
    response?.MobileParam?.PayToken,
    response?.WalletParam?.PayToken,
    response?.ATMParam?.PayToken,
  ];
  return candidates.find(token => typeof token === 'string' && token.trim()) || '';
}

function getSinopacPaymentError(response) {
  if (!response || typeof response !== 'object') return '';

  if (status && status !== 'S') return description || `永豐狀態：${status}`;
  if (/^E\d{4}/i.test(description)) return description;

}

function TopProductsCarousel({ products, user, onAdd, onSelect, isMobile, setPage, promotions = [] }) {
  const [active, setActive] = useState(0);
  const visibleCount = isMobile ? 2 : 4;
  const slideStep = isMobile ? 2 : 1;
  const intervalMs = isMobile ? 2000 : 5200;
  const maxStart = Math.max(0, products.length - visibleCount);
  const slideStarts = [];
  for (let index = 0; index <= maxStart; index += slideStep) slideStarts.push(index);
  if (slideStarts[slideStarts.length - 1] !== maxStart) slideStarts.push(maxStart);

  useEffect(() => {
    if (products.length <= visibleCount) return;
    const timer = setInterval(() => {
      setActive(current => {
        const currentIndex = slideStarts.indexOf(current);
        const nextIndex = currentIndex < 0 || currentIndex >= slideStarts.length - 1 ? 0 : currentIndex + 1;
        return slideStarts[nextIndex] || 0;
      });
    }, intervalMs);
    return () => clearInterval(timer);
  }, [intervalMs, maxStart, products.length, slideStarts.join('|'), visibleCount]);

  useEffect(() => {
    setActive(current => slideStarts.reduce((closest, item) => Math.abs(item - current) < Math.abs(closest - current) ? item : closest, slideStarts[0] || 0));
  }, [maxStart, slideStep]);

  const start = Math.min(active, maxStart);
  const gap = isMobile ? 10 : 24;
  const itemWidth = `calc((100% - ${gap * (visibleCount - 1)}px) / ${visibleCount})`;
  const slideOffset = `calc(-${start} * (${itemWidth} + ${gap}px))`;

  function move(delta) {
    setActive(current => {
      if (maxStart === 0) return 0;
      const currentIndex = slideStarts.indexOf(current);
      const fallbackIndex = currentIndex < 0 ? 0 : currentIndex;
      const nextIndex = fallbackIndex + delta;
      if (nextIndex < 0) return slideStarts[slideStarts.length - 1] || 0;
      if (nextIndex >= slideStarts.length) return 0;
      return slideStarts[nextIndex] || 0;
    });
  }

  return (
    <section style={{ background:'var(--off-white)', padding: isMobile ? '60px 0' : '100px 0', borderBottom:'1px solid var(--light)' }}>
      <div style={{ maxWidth:1280, margin:'0 auto', padding:'0 24px' }} className="px-page">
        <div style={{ display:'flex', justifyContent:'space-between', gap:24, alignItems:'flex-end', marginBottom: isMobile ? 28 : 42, flexWrap:'wrap' }}>
          <div style={{ maxWidth:680 }}>
            <p style={{ fontSize:11, letterSpacing:'0.28em', color:'var(--gold)', textTransform:'uppercase', marginBottom:10 }}>Popular</p>
            <h2 style={{ fontFamily:'var(--font-display)', fontSize:'clamp(24px,3.6vw,46px)', fontWeight:300, lineHeight:1.1, color:'var(--black)', marginBottom:14 }}>熱門商品</h2>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <button aria-label="上一組熱門商品" onClick={() => move(-1)} style={{ width:44, height:44, border:'1px solid var(--light)', background:'var(--white)', color:'var(--black)', cursor:'pointer', fontSize:18 }}>←</button>
            <button aria-label="下一組熱門商品" onClick={() => move(1)} style={{ width:44, height:44, border:'1px solid var(--black)', background:'var(--black)', color:'var(--white)', cursor:'pointer', fontSize:18 }}>→</button>
          </div>
        </div>

        <div style={{ overflow:'hidden' }}>
          <div style={{ display:'flex', gap, transform:`translateX(${slideOffset})`, transition:'transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)', willChange:'transform' }}>
            {products.map(product => (
              <div key={product.id} style={{ flex:`0 0 ${itemWidth}`, minWidth:0 }}>
                <ProductCard product={product} user={user} onAdd={() => onAdd(product)} onSelect={() => onSelect(product)} promotions={promotions} />
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginTop:24, display:'flex', justifyContent:'space-between', gap:18, alignItems:'center', flexWrap:'wrap' }}>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            {slideStarts.map((slideStart, index) => (
              <button key={slideStart} aria-label={`查看第 ${index + 1} 組熱門商品`} onClick={() => setActive(slideStart)} style={{ width:slideStart === start ? 28 : 9, height:3, border:'none', background:slideStart === start ? 'var(--black)' : 'var(--light)', cursor:'pointer', padding:0, transition:'all 0.25s' }} />
            ))}
          </div>
          <button onClick={() => setPage('shop')} style={{ background:'none', border:'none', borderBottom:'1px solid var(--dark)', color:'var(--dark)', cursor:'pointer', fontSize:13, paddingBottom:3 }}>瀏覽全部商品 →</button>
        </div>
      </div>
    </section>
  );
}

function HomePage({ setPage, user, cart, setCart, promotions = [], products = PRODUCTS, salesStats = emptySalesStats() }) {
  const [slide, setSlide] = useState(0);
  const [animating, setAnimating] = useState(false);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const isMobile = useIsMobile();
  const livePromos = promotions.filter(isPromotionLive);
  const topProducts = getPopularProducts(products, salesStats);

  useEffect(() => {
    const t = setInterval(() => {
      setAnimating(true);
      setTimeout(() => { setSlide(s => (s + 1) % HERO_SLIDES.length); setAnimating(false); }, 450);
    }, 7500);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!selectedProduct) return;
    const fresh = products.find(product => product.id === selectedProduct.id);
    if (fresh && fresh.stock !== selectedProduct.stock) {
      setSelectedProduct(fresh);
    }
  }, [products, selectedProduct]);

  const featured = products.filter(p => !p.isProOnly).slice(0, 4);

  function addToCart(product) {
    if (product.isProOnly && !isProfessionalMember(user)) return;
    setCart(prev => {
      const cartKey = getCartKey(product);
      const ex = prev.find(i => getCartKey(i) === cartKey);
      if (ex) return prev.map(i => getCartKey(i) === cartKey ? { ...i, qty: i.qty+1 } : i);
      return [...prev, { ...product, cartKey, qty:1 }];
    });
  }

  const heroPad = isMobile ? '0 6vw' : '0 10vw';

  if (selectedProduct) {
    return <ProductDetail product={selectedProduct} user={user} onAdd={addToCart} onBack={() => setSelectedProduct(null)} promotions={promotions} />;
  }

  return (
    <div>
      {/* HERO */}

        {HERO_SLIDES.map((s,i) => (

  const [activeImage, setActiveImage] = useState(0);
  const [activeVariant, setActiveVariant] = useState(0);
  const isMobile = useIsMobile();
  const images = getProductImages(product);
  const variants = getProductVariants(product);
  const selectedVariant = variants[activeVariant] || null;
  const displayProduct = applyVariantToProduct(product, selectedVariant);
  const showPrice = getMemberPrice(displayProduct, user);
  const priceTier = getMemberTier(user);
  const hasTierPrice = isProfessionalMember(user);
  const fulfillment = getFulfillmentInfo(displayProduct);

  const livePromosForProduct = (promotions || []).filter(p => isPromotionLive(p) && normProductIds(p).includes(Number(product.id)));
  const primaryPromo = livePromosForProduct[0];
  const promoDisplay = getPromoDisplayPrice(displayProduct, user, promotions);

  function handleAdd() {
    if (displayProduct.isProOnly && !isProfessionalMember(user)) return;
    const cartProduct = { ...displayProduct, cartKey: getCartKey(displayProduct) };
    for (let i = 0; i < qty; i++) onAdd(cartProduct);
    setAdded(true);
    setTimeout(() => setAdded(false), 2000);
  }

  useEffect(() => { window.scrollTo(0, 0); }, []);

    setActiveImage(0);
    setActiveVariant(0);

            ) : (
              <div style={{ borderTop:'1px solid var(--light)', borderBottom:'1px solid var(--light)', padding:'20px 0', marginBottom:28 }}>
                <div style={{ display:'flex', alignItems:'baseline', gap:12, flexWrap:'wrap' }}>
                  {promoDisplay ? (
                    <>
                      <span style={{ fontFamily:'var(--font-display)', fontSize:30, fontWeight:300, color:'var(--gold)' }}>NT$ {promoDisplay.price.toLocaleString()}</span>
                      <span style={{ fontSize:13, color:'var(--dark)', textDecoration:'line-through' }}>NT$ {showPrice.toLocaleString()}</span>
                    </>
                  ) : (
                    <>
                      <span style={{ fontFamily:'var(--font-display)', fontSize:30, fontWeight:300, color:'var(--black)' }}>NT$ {showPrice.toLocaleString()}</span>
                      {hasTierPrice && <>
                      <span style={{ fontSize:13, color:'var(--dark)', textDecoration:'line-through' }}>NT$ {displayProduct.price.toLocaleString()}</span>
                        <span style={{ fontSize:10, background:'var(--gold)', color:'var(--white)', padding:'3px 8px', letterSpacing:'0.1em', fontWeight:500 }}>{priceTier.priceLabel}</span>
                      </>}
                    </>
                  )}
                </div>
              </div>
            )}

            {/* 特點 */}
            <div style={{ marginBottom:28 }}>
              {product.features.map((f,i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
                  <div style={{ width:4, height:4, background:'var(--gold)', flexShrink:0 }} />
                  <span style={{ fontSize:13, color:'var(--dark)', letterSpacing:'0.04em' }}>{f}</span>
                </div>
              ))}
            </div>

            {/* 數量 + 加入購物車 — 僅限可購買商品 */}
            {!(displayProduct.isProOnly && !isProfessionalMember(user)) && (
              <div style={{ display:'flex', gap:12, alignItems:'center', marginBottom:14, flexWrap:'wrap' }}>
                <div style={{ display:'flex', alignItems:'center', border:'1px solid var(--light)' }}>
                  <button onClick={() => setQty(q => Math.max(1, q-1))} style={{ width:40, height:48, background:'none', border:'none', cursor:'pointer', fontSize:16, color:'var(--dark)', fontFamily:'var(--font-body)' }}>−</button>
                  <span style={{ width:36, textAlign:'center', fontSize:14, color:'var(--black)' }}>{qty}</span>
                  <button onClick={() => setQty(q => q+1)} style={{ width:40, height:48, background:'none', border:'none', cursor:'pointer', fontSize:16, color:'var(--dark)', fontFamily:'var(--font-body)' }}>+</button>
                </div>
                <button onClick={handleAdd} style={{ flex:1, minWidth:180, height:48, background: added ? 'var(--gold)' : 'var(--black)', color:'var(--white)', border:'none', cursor:'pointer', fontFamily:'var(--font-body)', fontSize:12, letterSpacing:'0.16em', textTransform:'uppercase', transition:'background 0.3s' }}>
                  {added ? '✓ 已加入購物車' : '加入購物車'}
                </button>
              </div>
            )}
            <p style={{ fontSize:11, color:'var(--dark)', lineHeight:1.8, borderTop:'1px solid var(--light)', paddingTop:14, marginTop:4 }}>
              ⚠ 本商品為個人衛生用品，依《消費者保護法》第 19 條之 1，<strong>已拆封商品不適用七天猶豫期退貨</strong>。未拆封商品自收到次日起 7 日內可無條件退貨（退回運費由消費者負擔）。如有品質瑕疵，不限拆封與否均可申請退換，運費由本公司負擔。詳見<a href="/info" style={{ color:'var(--dark)', textUnderlineOffset:2 }}>退換貨政策</a>。
            </p>
          </div>
        </div>

        {/* 下方詳細資訊 */}
        <div style={{ marginTop: isMobile ? 48 : 72, display:'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr 1fr', gap:1, background:'var(--light)' }}>
          {[
            { label:'商品描述', content: product.desc },
            { label:'主要成分', content: product.ingredients },
            { label:'適合膚質', content: product.skinType },
          ].map(({ label, content }) => (
            <div key={label} style={{ background:'var(--white)', padding: isMobile ? '28px 20px' : '36px 32px' }}>
              <p style={{ fontSize:10, letterSpacing:'0.24em', color:'var(--dark)', textTransform:'uppercase', marginBottom:14 }}>{label}</p>
              <p style={{ fontSize:14, color:'#555', lineHeight:1.9 }}>{content}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── PRODUCT CARD ─────────────────────────────────────────────────────────────
function ProductCard({ product, user, onAdd, onSelect, promotions = [] }) {
  const [hovered, setHovered] = useState(false);
  const canPurchase = !product.isProOnly || isProfessionalMember(user);
  const showPrice = getMemberPrice(product, user);
  const priceTier = getMemberTier(user);
  const hasTierPrice = isProfessionalMember(user);
  const onPromo = promotions.some(p => isPromotionLive(p) && normProductIds(p).includes(Number(product.id)));
  const promoDisplay = getPromoDisplayPrice(product, user, promotions);
  return (
    <div onClick={onSelect} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{ cursor:'pointer', position:'relative' }}>
      {onPromo && (
        <div style={{ position:'absolute', top:10, right:10, zIndex:3, background:'var(--gold)', color:'var(--white)', fontSize:10, padding:'3px 9px', letterSpacing:'0.1em', fontWeight:500 }}>活動中</div>
      )}
      <div style={{ position:'relative', overflow:'hidden', marginBottom:14 }}>
        <ProductAutoImage src={getProductImage(product)} alt={product.nameZh} product={product} mode="list" style={{ width:'100%', aspectRatio:'1', height:'auto', objectFit:'contain', background:'var(--off-white)', display:'block' }} />
        <div style={{ position:'absolute', bottom:0, left:0, right:0, background:'var(--black)', padding:'10px', transform: hovered?'translateY(0)':'translateY(100%)', transition:'transform 0.25s' }}>
          {canPurchase ? (
            <button onClick={e => { e.stopPropagation(); onAdd(); }} style={{ width:'100%', background:'none', border:'none', cursor:'pointer', color:'var(--white)', fontSize:11, letterSpacing:'0.15em', textTransform:'uppercase', fontFamily:'var(--font-body)', padding:'3px 0' }}>加入購物車</button>
          ) : (
            <span style={{ display:'block', textAlign:'center', color:'var(--white)', fontSize:11, letterSpacing:'0.12em', fontFamily:'var(--font-body)', padding:'3px 0' }}>查看商品介紹 →</span>
          )}
        </div>
      </div>
      <div>
        <p style={{ fontSize:12, color:'var(--dark)', marginBottom:8 }}>{product.nameZh} · {product.size}</p>
        {canPurchase ? (
          <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
            {promoDisplay ? (
              <>
                <span style={{ fontSize:15, fontWeight:500, fontFamily:'var(--font-display)', color:'var(--gold)' }}>NT$ {promoDisplay.price.toLocaleString()}</span>
                <span style={{ fontSize:11, color:'var(--dark)', textDecoration:'line-through' }}>NT$ {showPrice.toLocaleString()}</span>
              </>
            ) : (
              <>
                <span style={{ fontSize:15, fontWeight:500, color:'var(--black)' }}>NT$ {showPrice.toLocaleString()}</span>
                {hasTierPrice && <span style={{ fontSize:11, color:'var(--dark)', textDecoration:'line-through' }}>NT$ {product.price.toLocaleString()}</span>}
                {hasTierPrice && <span style={{ fontSize:10, background:'var(--off-white)', color:'var(--dark)', padding:'2px 6px' }}>{priceTier.priceLabel}</span>}
              </>
            )}
          </div>
        ) : (
          <div>
            <span style={{ fontSize:10, background:'var(--dark)', color:'var(--white)', padding:'2px 9px', letterSpacing:'0.1em', display:'inline-block', marginBottom:6 }}>院線商品</span>
            <p style={{ fontSize:11, color:'var(--dark)', lineHeight:1.6 }}>可查看商品介紹，購買請私訊 LINE 官方帳號詢問</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── PROMO SECTION (homepage) ────────────────────────────────────────────────
function PromoSection({ promo, user, addToCart, onSelect, isMobile, promotions = [], products = PRODUCTS }) {
  const ids = normProductIds(promo);
  const items = ids
    .map(id => products.find(p => p.id === id))
    .filter(Boolean)
    .filter(p => !p.isProOnly || isProfessionalMember(user));
  if (items.length === 0) {
    return (
      <section style={{ background:'var(--white)', padding: isMobile ? '48px 0' : '72px 0', borderTop:'1px solid var(--light)', borderBottom:'1px solid var(--light)' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', padding:'0 24px' }} className="px-page">
          <p style={{ fontSize:11, letterSpacing:'0.28em', color:'var(--gold)', marginBottom:10 }}>限時優惠</p>
          <p style={{ fontSize:14, color:'#555', lineHeight:1.75 }}>
            活動「<strong style={{ color:'var(--black)' }}>{promo.name}</strong>」已建立，但目前<strong>沒有可顯示的商品</strong>。
            請到後台確認已勾選商品，且商品編號需與官網一致（一般為 1～8）。
            {ids.length === 0 && '（目前 product_ids 為空）'}
          </p>
        </div>
      </section>
    );
  }

  return (
    <section style={{ background:'var(--white)', padding: isMobile ? '60px 0' : '100px 0', borderTop:'1px solid var(--light)', borderBottom:'1px solid var(--light)' }}>
      <div style={{ maxWidth:1280, margin:'0 auto', padding:'0 24px' }} className="px-page">
        <div style={{ marginBottom: isMobile ? 36 : 56 }}>
          <p style={{ fontSize:11, letterSpacing:'0.28em', color:'var(--gold)', marginBottom:10 }}>限時優惠</p>
          <h2 style={{ fontFamily:'var(--font-display)', fontSize:'clamp(26px,4vw,52px)', fontWeight:300, lineHeight:1.1, color:'var(--black)', marginBottom:12 }}>{promo.name}</h2>
          {promo.description && (
            <p style={{ fontSize:14, color:'#555', lineHeight:1.75, maxWidth:560, marginBottom:0 }}>{promo.description}</p>
          )}
        </div>

        <div className="g4">
          {items.map(p => (
            <div key={p.id} style={{ background:'var(--off-white)', color:'var(--black)', padding:14, border:'1px solid var(--light)' }}>
              <ProductCard product={p} user={user} onAdd={() => addToCart(p)} onSelect={() => onSelect(p)} promotions={promotions} />
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ─── SHOP PAGE ────────────────────────────────────────────────────────────────
function ShopPage({ user, cart, setCart, promotions = [], products = PRODUCTS, salesStats = emptySalesStats() }) {
  const [activeCategory, setActiveCategory] = useState('所有產品');
  const [sortBy, setSortBy] = useState('sales-desc');
  const [selectedProduct, setSelectedProduct] = useState(null);
  const categories = PRODUCT_NAV_LINKS;
  const isMobile = useIsMobile();

  function addToCart(product) {
    if (product.isProOnly && !isProfessionalMember(user)) return;
    setCart(prev => {
      const cartKey = getCartKey(product);
      const ex = prev.find(i => getCartKey(i) === cartKey);
      if (ex) return prev.map(i => getCartKey(i) === cartKey ? { ...i, qty: i.qty+1 } : i);
      return [...prev, { ...product, cartKey, qty:1 }];
    });
  }

  useEffect(() => {
    if (!selectedProduct) return;
    const fresh = products.find(product => product.id === selectedProduct.id);
    if (fresh && fresh.stock !== selectedProduct.stock) {
      setSelectedProduct(fresh);
    }
  }, [products, selectedProduct]);

  const filtered = products.filter(p => {
    if (activeCategory === '所有產品' || activeCategory === '全部') return true;
    return p.category === activeCategory;
  });
  const originalIndex = new Map(products.map((product, index) => [product.id, index]));
  const sortedProducts = [...filtered].sort((a, b) => {
    if (sortBy === 'price-asc' || sortBy === 'price-desc') {
      const diff = getMemberPrice(a, user) - getMemberPrice(b, user);
      return sortBy === 'price-asc'
        ? diff || (originalIndex.get(a.id) || 0) - (originalIndex.get(b.id) || 0)
        : -diff || (originalIndex.get(a.id) || 0) - (originalIndex.get(b.id) || 0);
    }
    const salesDiff = getProductSalesCount(b, salesStats) - getProductSalesCount(a, salesStats);
    return salesDiff || (originalIndex.get(a.id) || 0) - (originalIndex.get(b.id) || 0);
  });

  if (selectedProduct) {
    return <ProductDetail product={selectedProduct} user={user} onAdd={addToCart} onBack={() => setSelectedProduct(null)} promotions={promotions} />;
  }

  const livePromosShop = promotions.filter(isPromotionLive);

  return (
    <div style={{ paddingTop:68 }}>
      {livePromosShop.length > 0 && (
        <div style={{
          background:'var(--off-white)', borderBottom:'1px solid var(--light)',
          padding:'14px 20px', textAlign:'center',
        }}>
          <span style={{ fontSize:13, color:'var(--dark)', letterSpacing:'0.04em', lineHeight:1.6 }}>
            限時優惠進行中：購物車內含活動商品時會自動折抵。
          </span>
        </div>
      )}
      {/* 頂部 header */}
      <div style={{ position:'relative', height: isMobile ? 180 : 240, overflow:'hidden' }}>
        <img src="https://images.unsplash.com/photo-1631730359585-38a4935cbec4?w=1600&q=80&fit=crop" alt="" style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', objectPosition:'center 60%' }} />
        <div style={{ position:'absolute', inset:0, background:'rgba(12,12,10,0.58)' }} />
        <div style={{ position:'relative', height:'100%', maxWidth:1280, margin:'0 auto', padding: isMobile ? '0 24px' : '0 32px', display:'flex', alignItems:'flex-end', justifyContent:'space-between', flexWrap:'wrap', gap:12, paddingBottom: isMobile ? 28 : 36 }}>
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:12 }}>
              <div style={{ width:28, height:1, background:'var(--gold)' }} />
              <p style={{ fontSize:10, letterSpacing:'0.3em', color:'var(--gold)', textTransform:'uppercase', margin:0 }}>Shop</p>
            </div>
            <h1 style={{ fontFamily:'var(--font-display)', fontSize: isMobile ? 28 : 42, fontWeight:300, color:'var(--white)', lineHeight:1.1, margin:0 }}>全部商品</h1>
          </div>
          {isProfessionalMember(user) && (
            <div style={{ display:'flex', alignItems:'center', gap:8, paddingBottom:4 }}>
              <span style={{ fontSize:10, background:'var(--gold)', color:'var(--black)', padding:'3px 8px', letterSpacing:'0.12em', fontWeight:600 }}>{getMemberTier(user).badge}</span>
              <span style={{ fontSize:12, color:'rgba(255,255,255,0.6)', letterSpacing:'0.04em' }}>{getMemberTier(user).priceLabel}已啟用</span>
            </div>
          )}
        </div>
      </div>
      {/* 分類篩選列 */}
      <div className="filter-tabs" style={{ background:'var(--off-white)', borderBottom:'1px solid var(--light)', padding: isMobile ? '0 16px' : '0 32px' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between', gap:16, flexWrap:'wrap' }}>
          <div style={{ display:'flex' }}>
          {categories.map(cat => (
            <button key={cat} onClick={() => setActiveCategory(cat)} style={{
              background:'none', border:'none', cursor:'pointer', fontFamily:'var(--font-body)', fontSize:12,
              color: activeCategory===cat ? 'var(--black)' : 'var(--dark)',
              padding:'16px 20px', letterSpacing:'0.08em', textTransform:'uppercase',
              borderBottom: activeCategory===cat ? '2px solid var(--black)' : '2px solid transparent',
              fontWeight: activeCategory===cat ? 500 : 300, transition:'all 0.2s',
            }}>{cat}</button>
          ))}
          </div>
          <label style={{ display:'flex', alignItems:'center', gap:10, padding: isMobile ? '0 0 14px' : '0', fontSize:11, letterSpacing:'0.12em', color:'var(--dark)', whiteSpace:'nowrap' }}>
            排序
            <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{
              appearance:'none', background:'var(--white)', border:'1px solid var(--light)', color:'var(--black)',
              padding:'9px 34px 9px 12px', fontFamily:'var(--font-body)', fontSize:12, letterSpacing:'0.06em', cursor:'pointer',
              backgroundImage:'linear-gradient(45deg, transparent 50%, var(--dark) 50%), linear-gradient(135deg, var(--dark) 50%, transparent 50%)',
              backgroundPosition:'calc(100% - 16px) 50%, calc(100% - 11px) 50%', backgroundSize:'5px 5px, 5px 5px', backgroundRepeat:'no-repeat',
            }}>
              <option value="sales-desc">銷售量高到低</option>
              <option value="price-asc">價格低到高</option>
              <option value="price-desc">價格高到低</option>
            </select>
          </label>
        </div>
      </div>
      <div style={{ maxWidth:1280, margin:'0 auto', padding: isMobile ? '40px 20px' : '60px 32px' }}>
        {false && null /* pro banner moved to header */}
        <div className="g4lg">
          {sortedProducts.map(p => <ProductCard key={p.id} product={p} user={user} onAdd={() => addToCart(p)} onSelect={() => setSelectedProduct(p)} promotions={promotions} />)}
        </div>
        {sortedProducts.length === 0 && <div style={{ textAlign:'center', padding:'80px 0', color:'var(--dark)', fontSize:14 }}>此分類目前無商品</div>}
      </div>
    </div>
  );
}

// ─── CART PAGE ────────────────────────────────────────────────────────────────
function CartPage({ cart, setCart, setPage, user, promotions = [] }) {
  const isMobile = useIsMobile();
  function updateQty(key, delta) {
    setCart(prev => prev.map(i => getCartKey(i) === key ? { ...i, qty: Math.max(0, i.qty+delta) } : i).filter(i => i.qty>0));
  }
  const { subtotal, discount, finalSubtotal, promotion } = calculateDiscount(cart, promotions, user);
  const shipping = cart.every(i => i.id === 9) ? 0 : 120;
  const grandTotal = finalSubtotal + shipping;

  return (
    <div style={{ paddingTop:68, minHeight:'80vh' }}>
      <div style={{ maxWidth:900, margin:'0 auto', padding: isMobile ? '40px 20px' : '60px 32px' }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:14, marginBottom:40 }}>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize: isMobile ? 30 : 40, fontWeight:300 }}>購物車</h1>
          <span style={{ fontSize:14, color:'var(--dark)' }}>{cart.length} 件商品</span>
        </div>

        {cart.length > 0 && promotions.some(isPromotionLive) && discount === 0 && (
          <div style={{ background:'var(--off-white)', border:'1px solid var(--gold)', padding:'14px 18px', marginBottom:24, fontSize:13, color:'var(--dark)', lineHeight:1.65 }}>
            目前有<strong>限時優惠</strong>，但購物車內還沒有「活動指定商品」，所以尚無折抵。
          </div>
        )}

        {cart.length === 0 ? (
          <div style={{ textAlign:'center', padding:'80px 0' }}>
            <p style={{ fontFamily:'var(--font-display)', fontSize:22, fontWeight:300, color:'var(--dark)', marginBottom:24 }}>購物車是空的</p>
            <button onClick={() => setPage('shop')} style={{ background:'var(--black)', color:'var(--white)', border:'none', padding:'12px 36px', fontSize:12, letterSpacing:'0.15em', cursor:'pointer', fontFamily:'var(--font-body)' }}>繼續購物</button>
          </div>
        ) : (
          <div className="gcart">
            <div>
              {cart.map(item => {
                const fulfillment = getFulfillmentInfo(item);
                return (
                  <div key={getCartKey(item)} style={{ display:'grid', gridTemplateColumns:'72px 1fr auto', gap:16, alignItems:'center', padding:'20px 0', borderBottom:'1px solid var(--light)' }}>
                    <img src={item.img} alt={item.nameZh} style={{ width:72, height:72, objectFit:'contain', background:'var(--off-white)', display:'block' }} />
                    <div>
                      <p style={{ fontFamily:'var(--font-display)', fontSize:14, fontWeight:400, marginBottom:3 }}>{item.name}</p>
                      <p style={{ fontSize:12, color:'var(--dark)', marginBottom:6 }}>{item.nameZh} · {item.size}</p>
                      <p style={{ fontSize:11, color: fulfillment.type === 'preorder' ? 'var(--gold)' : 'var(--dark)', marginBottom:10, lineHeight:1.5 }}>{fulfillment.type === 'loading' ? '庫存資料載入中' : `${fulfillment.label} · ${fulfillment.shipping}`}</p>
                      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                        <button onClick={() => updateQty(getCartKey(item),-1)} style={{ width:26, height:26, border:'1px solid var(--light)', background:'none', cursor:'pointer', fontSize:15, lineHeight:1 }}>−</button>
                        <span style={{ fontSize:14, minWidth:20, textAlign:'center', fontFamily:'var(--font-display)' }}>{item.qty}</span>
                        <button onClick={() => updateQty(getCartKey(item),1)} style={{ width:26, height:26, border:'1px solid var(--light)', background:'none', cursor:'pointer', fontSize:15, lineHeight:1 }}>+</button>
                      </div>
                    </div>
                    <div style={{ textAlign:'right' }}>
                      <p style={{ fontSize:14, fontWeight:500, fontFamily:'var(--font-display)' }}>NT$ {(getMemberPrice(item, user)*item.qty).toLocaleString()}</p>
                      <button onClick={() => updateQty(getCartKey(item),-item.qty)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:11, color:'var(--dark)', marginTop:6 }}>移除</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{ background:'var(--off-white)', padding:'28px', height:'fit-content' }}>
              <h3 style={{ fontFamily:'var(--font-display)', fontSize:18, fontWeight:400, marginBottom:20 }}>訂單摘要</h3>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:10, fontSize:13 }}><span>小計</span><span style={{ fontFamily:'var(--font-display)' }}>NT$ {subtotal.toLocaleString()}</span></div>
              {discount > 0 && promotion && (
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:10, fontSize:13, color:'var(--gold)' }}>
                  <span>{promotion.name}</span>
                  <span style={{ fontFamily:'var(--font-display)' }}>−NT$ {discount.toLocaleString()}</span>
                </div>
              )}
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:10, fontSize:13 }}>
                <span>運費</span>
                <span style={{ fontFamily:'var(--font-display)' }}>{shipping === 0 ? <span style={{ color:'var(--gold)', fontFamily:'var(--font-body)' }}>免運</span> : `NT$ ${shipping}`}</span>
              </div>
              <div style={{ height:1, background:'var(--light)', margin:'16px 0' }} />
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:24, fontWeight:500 }}>
                <span style={{ fontSize:14 }}>合計</span>
                <span style={{ fontFamily:'var(--font-display)', fontSize:18 }}>NT$ {grandTotal.toLocaleString()}</span>
              </div>
              <button onClick={() => setPage('checkout')} style={{ width:'100%', background:'var(--black)', color:'var(--white)', border:'none', padding:'15px', fontSize:12, letterSpacing:'0.18em', textTransform:'uppercase', cursor:'pointer', fontFamily:'var(--font-body)', fontWeight:500 }}
                onMouseEnter={e=>e.target.style.background='#333'}
                onMouseLeave={e=>e.target.style.background='var(--black)'}
              >前往結帳</button>
              <p style={{ textAlign:'center', fontSize:11, color:'var(--dark)', marginTop:14 }}>支援：虛擬帳號匯款 / 信用卡 / Apple Pay / Google Pay</p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CHECKOUT FIELD (must be outside CheckoutPage to avoid remount on every keystroke) ───
function CheckoutField({ label, name, type, required, placeholder, value, onChange }) {
  return (
    <div>
      <label style={{ fontSize:11, letterSpacing:'0.12em', color:'var(--dark)', textTransform:'uppercase', display:'block', marginBottom:7, fontFamily:'var(--font-body)' }}>
        {label}{required !== false && <span style={{ color:'var(--gold)', marginLeft:3 }}>*</span>}
      </label>
      <input type={type||'text'} value={value} onChange={onChange} required={required !== false} placeholder={placeholder||''}
        style={{ width:'100%', border:'none', borderBottom:'1px solid var(--light)', padding:'10px 0', fontSize:14, fontFamily:'var(--font-body)', fontVariantNumeric:'tabular-nums', outline:'none', background:'none', color:'var(--black)', boxSizing:'border-box' }}
        onFocus={e=>e.target.style.borderBottomColor='var(--black)'}
        onBlur={e=>e.target.style.borderBottomColor='var(--light)'}
      />
    </div>
  );
}

// ─── CHECKOUT PAGE ────────────────────────────────────────────────────────────
function CheckoutPage({ cart, setCart, setPage, user, promotions = [] }) {
  const isLineEmail = user?.email?.startsWith('line.');
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({
    name: user?.name || '',
    phone: '',
    email: isLineEmail ? '' : (user?.email || ''),
    city: '',
    district: '',
    address: '',
    note: '',
  });
  const [orderNo] = useState(() => `ECL-${Date.now().toString().slice(-8)}`);
  const [paymentMethod, setPaymentMethod] = useState('atm');
  const [paymentResult, setPaymentResult] = useState(null);
  const [paymentSnapshot, setPaymentSnapshot] = useState(null);
  const [paymentSummary, setPaymentSummary] = useState(null);
  const [paymentError, setPaymentError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [copiedAtmNo, setCopiedAtmNo] = useState(false);
  const isMobile = useIsMobile();

  const { subtotal, discount, finalSubtotal, promotion } = calculateDiscount(cart, promotions, user);
  const shipping = cart.every(i => i.id === 9) ? 0 : 120;
  const total = finalSubtotal + shipping;

  const STEPS = ['收件資訊', '確認付款', '完成'];

  function setField(name) {
    return e => setForm(f => ({ ...f, [name]: e.target.value }));
  }

  function productNameForPayment() {
    if (!cart.length) return 'ECLADO訂單';
    if (cart.length === 1) return cart[0].nameZh;
    return `${cart[0].nameZh} 等 ${cart.length} 項商品`;
  }

  function StepBar() {
    return (
      <div style={{ display:'flex', alignItems:'center', marginBottom:40 }}>
        {STEPS.map((s, i) => (
          <React.Fragment key={s}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
              <div style={{ width:28, height:28, borderRadius:'50%', background: step >= i + 1 ? 'var(--black)' : 'var(--light)', color: step >= i + 1 ? 'var(--white)' : 'var(--mid)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:500 }}>
                {step > i + 1 ? '✓' : i + 1}
              </div>
              <span style={{ fontSize:10, letterSpacing:'0.08em', color: step === i + 1 ? 'var(--black)' : 'var(--mid)', whiteSpace:'nowrap' }}>{s}</span>
            </div>
            {i < STEPS.length - 1 && <div style={{ flex:1, height:1, background: step > i + 1 ? 'var(--black)' : 'var(--light)', margin:'0 8px', marginBottom:18 }} />}
          </React.Fragment>
        ))}
      </div>
    );
  }

  function OrderSummary() {
    const summary = paymentSummary || { subtotal, discount, finalSubtotal, promotion, shipping, total };
    const summaryItems = paymentSnapshot?.items || cart;
    const hasPreorderItem = summaryItems.some(item => getFulfillmentInfo(item).type === 'preorder');
    return (
      <div style={{ background:'var(--off-white)', padding:'28px 24px', height:'fit-content' }}>
        <h3 style={{ fontFamily:'var(--font-display)', fontSize:16, fontWeight:400, marginBottom:20, letterSpacing:'0.04em' }}>訂單明細</h3>
        {hasPreorderItem && (
          <div style={{ background:'var(--white)', border:'1px solid var(--gold)', padding:'12px 14px', marginBottom:16, fontSize:12, color:'var(--dark)', lineHeight:1.7 }}>
            訂單含預購商品，預購品項出貨時間為 7-14 個工作天。
          </div>
        )}
        <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:18 }}>
          {summaryItems.map(item => {
            const unitPrice = getMemberPrice(item, user);
            const fulfillment = getFulfillmentInfo(item);
            return (
              <div key={getCartKey(item)} style={{ display:'flex', gap:12, alignItems:'center' }}>
                <div style={{ width:48, height:48, flexShrink:0, position:'relative' }}>
                  <img src={item.img} alt={item.nameZh} style={{ width:'100%', height:'100%', objectFit:'contain', background:'var(--off-white)', display:'block' }} />
                  <div style={{ position:'absolute', top:-6, right:-6, width:18, height:18, borderRadius:'50%', background:'var(--dark)', color:'var(--white)', fontSize:10, display:'flex', alignItems:'center', justifyContent:'center' }}>{item.qty}</div>
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <p style={{ fontSize:12, color:'var(--black)', marginBottom:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.nameZh}</p>
                  <p style={{ fontSize:11, color:'var(--dark)' }}>{item.size}</p>
                  <p style={{ fontSize:10, color: fulfillment.type === 'preorder' ? 'var(--gold)' : 'var(--dark)', marginTop:3, lineHeight:1.45 }}>{fulfillment.type === 'loading' ? '庫存資料載入中' : `${fulfillment.label} · ${fulfillment.shipping.replace('出貨時間為 ', '')}`}</p>
                </div>
                <span style={{ fontSize:13, color:'var(--black)', flexShrink:0, fontFamily:'var(--font-display)' }}>NT$ {(unitPrice * item.qty).toLocaleString()}</span>
              </div>
            );
          })}
        </div>
        <div style={{ height:1, background:'var(--light)', marginBottom:14 }} />
        <div style={{ display:'flex', justifyContent:'space-between', fontSize:13, color:'var(--dark)', marginBottom:8 }}>
          <span>小計</span><span style={{ fontFamily:'var(--font-display)' }}>NT$ {summary.subtotal.toLocaleString()}</span>
        </div>
        {summary.discount > 0 && summary.promotion && (
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:13, color:'var(--gold)', marginBottom:8 }}>
            <span style={{ display:'flex', alignItems:'center', gap:6 }}>
              <span style={{ background:'var(--gold)', color:'var(--white)', fontSize:9, padding:'1px 5px', letterSpacing:'0.06em' }}>活動</span>
              {summary.promotion.name}
            </span>
            <span style={{ fontFamily:'var(--font-display)' }}>−NT$ {summary.discount.toLocaleString()}</span>
          </div>
        )}
        <div style={{ display:'flex', justifyContent:'space-between', fontSize:13, color:'var(--dark)', marginBottom:14, alignItems:'center' }}>
          <span>運費 <span style={{ fontSize:10, color:'var(--dark)' }}>（宅配到府）</span></span>
          <span style={{ fontFamily:'var(--font-display)' }}>{summary.shipping === 0 ? <span style={{ color:'var(--gold)', fontFamily:'var(--font-body)' }}>免運</span> : `NT$ ${summary.shipping}`}</span>
        </div>
        <div style={{ height:1, background:'var(--light)', marginBottom:14 }} />
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
          <span style={{ fontSize:13, fontWeight:500 }}>合計</span>
          <span style={{ fontFamily:'var(--font-display)', fontSize:20, fontWeight:300 }}>NT$ {summary.total.toLocaleString()}</span>
        </div>
      </div>
    );
  }

  async function sendOrderPlacedEmail() {
    if (!form.email || user?.email?.startsWith('line.')) return;
    await fetch('/api/order-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'order_placed',
        email: form.email,
        orderId: orderNo,
        memberName: form.name || user?.name || '訪客',
        total,
      }),
    }).catch(error => console.warn('[ECLADO] 訂單 Email 通知送出失敗：', error));
  }

  async function insertOrder(paymentData, methodLabel) {
    const today = new Date();
    const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    const noteParts = [safeTrim(form.note), buildPaymentNotes(methodLabel, paymentData)].filter(Boolean);
    const order = {
      id: orderNo,
      member: form.name || user?.name || '訪客',
      type: getMemberRole(user),
      items: cart.map(i => {
        const fulfillment = getFulfillmentInfo(i);
        return {
          id: i.id,
          name: i.nameZh,
          qty: i.qty,
          price: getMemberPrice(i, user),
          fulfillment: fulfillment.label,
          fulfillment_type: fulfillment.type,
          shipping_time: fulfillment.shipping,
          stock_at_order: Number(i.stock ?? 0),
        };
      }),
      total,
      subtotal,
      discount,
      promotion_id: promotion?.id || null,
      promotion_name: promotion?.name || null,
      status: 'awaiting_confirm',
      date: dateStr,
      address: `${form.city}${form.district}${form.address}`,
      phone: form.phone,
      email: form.email,
      note: noteParts.join('\n\n'),
      transfer_last5: paymentData?.ATMParam?.AtmPayNo ? paymentData.ATMParam.AtmPayNo.slice(-5) : '',
      user_id: user?.uid || null,
    };
    const { error } = await supabase.from('orders').insert(order);
    if (!error) await sendOrderPlacedEmail();
    return error;
  }

  async function handleNext(e) {
    e.preventDefault();
    if (step === 1) {
      window.scrollTo(0, 0);
      setStep(2);
      return;
    }
    if (step !== 2) return;

    const method = PAYMENT_METHODS[paymentMethod] || PAYMENT_METHODS.atm;
    const expiresAt = addDays(new Date(), 1);
    const payload = {
      orderNo,
      amount: total,
      prdtName: productNameForPayment(),
      payType: method.payType,
      expireDate: formatDateCompact(expiresAt),
      expireTime: formatTimeCompact(expiresAt),
      returnUrl: `${SINOPAC_PAYMENT_API}/return?orderNo=${encodeURIComponent(orderNo)}`,
      backendUrl: `${SINOPAC_NOTIFY_API}?orderNo=${encodeURIComponent(orderNo)}`,
      qrCodeStatus: 'Y',
      memo: safeTrim(form.note),
      Param1: orderNo,
    };
    if (method.choosePay) payload.choosePay = method.choosePay;

    setPaymentError('');
    setSubmitting(true);
    let timeout;
    try {
      const controller = new AbortController();
      timeout = setTimeout(() => controller.abort(), PAYMENT_REQUEST_TIMEOUT_MS);
      const response = await fetch(`${SINOPAC_PAYMENT_API}/api/sinopac/create-payment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });
      clearTimeout(timeout);
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || `金流建立失敗（HTTP ${response.status}）`);
      }

      const apiResponse = data.response || {};
      const sinopacError = getSinopacPaymentError(apiResponse);
      if (sinopacError) throw new Error(sinopacError);

      setPaymentSnapshot(cart.map(item => ({ ...item })));
      setPaymentSummary({ subtotal, discount, finalSubtotal, promotion, shipping, total, items: cart.map(item => ({ ...item })) });
      const insertError = await insertOrder(apiResponse, method.label);
      if (insertError) console.error(insertError);

      const paymentLink = extractPaymentLink(apiResponse);
      setPaymentResult({
        method: paymentMethod,
        methodLabel: method.label,
        request: payload,
        response: apiResponse,
        paymentLink,
        insertError: insertError ? (insertError.message || String(insertError)) : '',
      });
      setCart([]);
      window.scrollTo(0, 0);
      setStep(3);
    } catch (err) {
      console.error(err);
      const message = err?.name === 'AbortError'
        ? '付款服務連線逾時，請稍後再試或聯繫客服。'
        : '付款單建立失敗，請稍後再試或聯繫客服。' + (err?.message ? `（${err.message}）` : '');
      setPaymentError(message);
    } finally {
      if (timeout) clearTimeout(timeout);
      setSubmitting(false);
    }
  }

  function copyAtmNo(atmNo) {
    navigator.clipboard?.writeText(atmNo);
    setCopiedAtmNo(true);
    setTimeout(() => setCopiedAtmNo(false), 2200);
  }

  function PaymentInfo() {
    if (!paymentResult) return null;
    const resp = paymentResult.response || {};
    const atmNo = resp?.ATMParam?.AtmPayNo || '';
    const paymentLink = paymentResult.paymentLink || '';
    return (
      <div style={{ background:'var(--off-white)', padding:'24px 28px', marginBottom:20 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, gap:12 }}>
          <p style={{ fontSize:10, letterSpacing:'0.2em', color:'var(--dark)', textTransform:'uppercase' }}>付款資訊</p>
          <span style={{ fontSize:10, background:'var(--gold)', color:'var(--white)', padding:'3px 10px', letterSpacing:'0.1em' }}>{paymentResult.methodLabel}</span>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'auto 1fr', gap:'8px 20px', fontSize:13 }}>
          <span style={{ color:'var(--dark)' }}>訂單編號</span>
          <span style={{ color:'var(--black)', letterSpacing:'0.08em', fontFamily:'var(--font-display)', fontVariantNumeric:'tabular-nums' }}>{orderNo}</span>
          {resp?.TSNo && <>
            <span style={{ color:'var(--dark)' }}>交易編號</span>
            <span style={{ color:'var(--black)', letterSpacing:'0.08em', fontFamily:'var(--font-display)', fontVariantNumeric:'tabular-nums' }}>{resp.TSNo}</span>
          </>}
          {atmNo && <>
            <span style={{ color:'var(--dark)' }}>銀行代碼</span>
            <span style={{ color:'var(--black)', fontFamily:'var(--font-display)', fontWeight:500 }}>807 永豐銀行</span>
          </>}
          {atmNo && <>
            <span style={{ color:'var(--dark)' }}>虛擬帳號</span>
            <span style={{ color:'var(--black)', fontFamily:'var(--font-display)', letterSpacing:'0.12em', fontWeight:500, fontVariantNumeric:'tabular-nums' }}>{atmNo}</span>
          </>}
          <span style={{ color:'var(--dark)' }}>金額</span>
          <span style={{ color:'var(--black)', fontFamily:'var(--font-display)', fontWeight:500 }}>NT$ {total.toLocaleString()}</span>
        </div>
        {resp?.Description && <p style={{ fontSize:12, color:'var(--dark)', marginTop:12, lineHeight:1.7 }}>{resp.Description}</p>}
        {paymentResult.insertError && <p style={{ fontSize:12, color:'#b45309', marginTop:12, lineHeight:1.7 }}>付款單已建立，但本站訂單寫入失敗：{paymentResult.insertError}</p>}
        {atmNo && (
          <div style={{ display:'flex', gap:10, marginTop:16, flexWrap:'wrap' }}>
            <button type="button" onClick={() => copyAtmNo(atmNo)} style={{ background:'var(--black)', border:'1px solid var(--black)', color:'var(--white)', padding:'11px 16px', fontSize:12, letterSpacing:'0.12em', cursor:'pointer', fontFamily:'var(--font-body)' }}>
              複製虛擬帳號
            </button>
            {copiedAtmNo && <span style={{ display:'inline-flex', alignItems:'center', color:'var(--black)', fontSize:12, letterSpacing:'0.08em', fontFamily:'var(--font-body)' }}>虛擬帳號已複製</span>}
          </div>
        )}
        {!atmNo && paymentLink && (
          <div style={{ display:'flex', gap:10, marginTop:16, flexWrap:'wrap' }}>
            <a href={paymentLink} target="_blank" rel="noreferrer" style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', padding:'11px 16px', border:'1px solid var(--black)', color:'var(--black)', textDecoration:'none', fontSize:12, letterSpacing:'0.12em', fontFamily:'var(--font-body)' }}>
              前往付款頁
            </a>
            <button type="button" onClick={() => navigator.clipboard?.writeText(paymentLink)} style={{ background:'none', border:'1px solid var(--light)', color:'var(--dark)', padding:'11px 16px', fontSize:12, letterSpacing:'0.12em', cursor:'pointer', fontFamily:'var(--font-body)' }}>
              複製付款連結
            </button>
          </div>
        )}
      </div>
    );
  }

  if (step === 3) return (
    <div style={{ paddingTop:68, minHeight:'80vh' }}>
      <div style={{ maxWidth:960, margin:'0 auto', padding: isMobile ? '40px 20px' : '60px 40px' }}>
        <h1 style={{ fontFamily:'var(--font-display)', fontSize: isMobile ? 28 : 36, fontWeight:300, marginBottom:36 }}>結帳</h1>
        <StepBar />

        <div style={{ maxWidth:520, margin:'0 auto', textAlign:'center' }}>
          <div style={{ width:56, height:56, border:'1px solid var(--black)', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px', fontSize:22 }}>✓</div>
          <h2 style={{ fontFamily:'var(--font-display)', fontSize:30, fontWeight:300, marginBottom:10 }}>付款單已建立</h2>
          <p style={{ fontSize:13, color:'var(--dark)', marginBottom:26 }}>訂單編號：<strong style={{ color:'var(--dark)', letterSpacing:'0.06em', fontFamily:'var(--font-display)', fontVariantNumeric:'tabular-nums' }}>{orderNo}</strong></p>
        </div>

        <div className="gcheckout">
          <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
            <PaymentInfo />

            <div style={{ background:'var(--off-white)', padding:'24px 28px' }}>
              <p style={{ fontSize:10, letterSpacing:'0.2em', color:'var(--dark)', textTransform:'uppercase', marginBottom:16 }}>配送資訊</p>
              <div style={{ display:'grid', gridTemplateColumns:'auto 1fr', gap:'8px 20px', fontSize:13 }}>
                {[['收件人', form.name], ['手機', form.phone], ['地址', `${form.city}${form.district}${form.address}`], ['物流','宅配到府（順豐物流）']].map(([k, v]) => (
                  <React.Fragment key={k}>
                    <span style={{ color:'var(--dark)', whiteSpace:'nowrap' }}>{k}</span>
                    <span style={{ color:'var(--black)' }}>{v}</span>
                  </React.Fragment>
                ))}
              </div>
            </div>

            <p style={{ fontSize:12, color:'var(--dark)', lineHeight:1.8, textAlign:'center' }}>
              請依付款頁或虛擬帳號完成付款。系統會在永豐通知後更新訂單狀態。<br />
              如有疑問請透過官方 LINE 聯繫客服。
            </p>

            <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
              <button onClick={() => setPage('shop')} style={{ flex:1, background:'none', border:'1px solid var(--black)', color:'var(--black)', padding:'13px 0', fontSize:12, letterSpacing:'0.14em', cursor:'pointer', fontFamily:'var(--font-body)' }}>繼續購物</button>
              <button onClick={() => setPage('home')} style={{ flex:1, background:'var(--black)', color:'var(--white)', border:'none', padding:'13px 0', fontSize:12, letterSpacing:'0.14em', cursor:'pointer', fontFamily:'var(--font-body)' }}>返回首頁</button>
            </div>
          </div>

          <OrderSummary />
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ paddingTop:68 }}>
      <div style={{ maxWidth:960, margin:'0 auto', padding: isMobile ? '40px 20px' : '60px 40px' }}>
        <h1 style={{ fontFamily:'var(--font-display)', fontSize: isMobile ? 28 : 36, fontWeight:300, marginBottom:36 }}>結帳</h1>
        <StepBar />

        <form onSubmit={handleNext}>
          <div className="gcheckout">
            <div>
              {step === 1 && (
                <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
                  <div style={{ background:'var(--off-white)', border:'1px solid var(--light)', padding:'16px 20px', display:'flex', alignItems:'center', gap:14 }}>
                    <div style={{ width:36, height:36, background:'var(--black)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                    <div>
                      <p style={{ fontSize:12, fontWeight:500, color:'var(--black)', marginBottom:2 }}>宅配到府</p>
                      <p style={{ fontSize:11, color:'var(--dark)' }}>順豐物流 · NT$ 120</p>
                    </div>
                  </div>

                  <div style={{ display:'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap:20 }}>
                    <CheckoutField label="收件人姓名" name="name" value={form.name} onChange={setField('name')} />
                    <CheckoutField label="手機號碼" name="phone" type="tel" placeholder="09xx-xxx-xxx" value={form.phone} onChange={setField('phone')} />
                  </div>
                  <CheckoutField label="電子信箱" name="email" type="email" value={form.email} onChange={setField('email')} />

                  <div>
                    <label style={{ fontSize:11, letterSpacing:'0.12em', color:'var(--dark)', textTransform:'uppercase', display:'block', marginBottom:7 }}>收件地址 <span style={{ color:'var(--gold)' }}>*</span></label>
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
                      {[['city','縣市'],['district','區域']].map(([k,ph]) => (
                        <input key={k} type="text" value={form[k]} onChange={e => setForm(f => ({ ...f, [k]: e.target.value }))} required placeholder={ph}
                          style={{ border:'none', borderBottom:'1px solid var(--light)', padding:'10px 0', fontSize:14, fontFamily:'var(--font-body)', fontVariantNumeric:'tabular-nums', outline:'none', background:'none', color:'var(--black)' }}
                          onFocus={e => e.target.style.borderBottomColor='var(--black)'}
                          onBlur={e => e.target.style.borderBottomColor='var(--light)'}
                        />
                      ))}
                    </div>
                    <input type="text" value={form.address} onChange={e => setForm(f => ({ ...f, address: e.target.value }))} required placeholder="路/街/巷/弄/號/樓"
                      style={{ width:'100%', border:'none', borderBottom:'1px solid var(--light)', padding:'10px 0', fontSize:14, fontFamily:'var(--font-body)', fontVariantNumeric:'tabular-nums', outline:'none', background:'none', color:'var(--black)', boxSizing:'border-box' }}
                      onFocus={e => e.target.style.borderBottomColor='var(--black)'}
                      onBlur={e => e.target.style.borderBottomColor='var(--light)'}
                    />
                  </div>

                  <div>
                    <label style={{ fontSize:11, letterSpacing:'0.12em', color:'var(--dark)', textTransform:'uppercase', display:'block', marginBottom:7 }}>備註（選填）</label>
                    <textarea value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} rows={3} placeholder="如有特殊需求請於此備註"
                      style={{ width:'100%', border:'1px solid var(--light)', padding:'10px 12px', fontSize:13, fontFamily:'var(--font-body)', outline:'none', resize:'none', background:'none', color:'var(--black)', boxSizing:'border-box', lineHeight:1.7 }}
                      onFocus={e => e.target.style.borderColor='var(--black)'}
                      onBlur={e => e.target.style.borderColor='var(--light)'}
                    />
                  </div>

const ECLADO_SITE_ORIGIN = 'https://www.ecladotaiwan.com';

function getSiteOrigin() {
  const { hostname, origin } = window.location;
  if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname.endsWith('.vercel.app')) {
    return origin;
  }
  return ECLADO_SITE_ORIGIN;
}

function getAuthRedirectUrl() {
  return `${getSiteOrigin()}/login`;
}

function getPasswordResetRedirectUrl() {
  return `${getSiteOrigin()}/reset-password`;
}

function getUrlAuthParams() {
  const search = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  const merged = new URLSearchParams();
  search.forEach((v, k) => merged.set(k, v));
  hash.forEach((v, k) => { if (!merged.has(k)) merged.set(k, v); });
  return merged;
}

function hasAuthCallbackInUrl() {
  const p = getUrlAuthParams();
  return p.has('code') || p.has('access_token')
    || (p.has('error') && (p.has('error_description') || p.has('error_code')));
}

function isPasswordRecoveryUrl() {
  const p = getUrlAuthParams();
  const path = (window.location.pathname || '/').replace(/\/$/, '') || '/';
  return path === '/reset-password' || p.get('type') === 'recovery';
}

function isEmailVerificationCallback() {
  const t = getUrlAuthParams().get('type');
  return t === 'signup' || t === 'email' || t === 'invite' || t === 'magiclink';
}

function getAuthCallbackErrorMessage() {
  const err = getUrlAuthParams().get('error_description') || getUrlAuthParams().get('error');
  if (!err) return '';
  try { return decodeURIComponent(String(err).replace(/\+/g, ' ')); }
  catch { return String(err); }
}

function cleanAuthCallbackFromUrl(path) {
  const pageKey = path === '/reset-password' ? 'reset-password' : path === '/login' ? 'login' : 'home';
  window.history.replaceState({ page: pageKey }, '', path);
}

const LINE_LOGIN_ERROR_MESSAGES = {
  line_denied: 'LINE 登入已取消，請重新操作。',
  config: 'LINE 登入設定尚未完成，請聯繫客服。',
  token_failed: 'LINE 授權驗證失敗，請重新登入。',
  profile_failed: '無法取得 LINE 會員資料，請重新登入。',
  create_failed: '無法建立 LINE 會員，請稍後再試。',
  link_failed: 'LINE 會員登入連結建立失敗，請稍後再試。',
  server_error: 'LINE 登入服務暫時無法使用，請稍後再試。',
};

function getLineLoginErrorMessage() {
  const errorCode = new URLSearchParams(window.location.search).get('error');
  if (!errorCode) return '';
  return LINE_LOGIN_ERROR_MESSAGES[errorCode] || `LINE 登入失敗：${errorCode}`;
}

  const [name, setName]         = useState('');
  const [phone, setPhone]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState('');
  const [success, setSuccess]   = useState('');

  function reset() { setError(''); setSuccess(''); }

  useEffect(() => {
    const lineError = getLineLoginErrorMessage();
    if (lineError) {
      setView('login');
      setError(lineError);
      cleanAuthCallbackFromUrl('/login');
      return;
    }
    const notice = sessionStorage.getItem('eclado_auth_notice');
    if (notice === 'email_verified') {
      sessionStorage.removeItem('eclado_auth_notice');
      setView('login');
      setSuccess('✓ Email 已驗證成功，請使用您的帳號密碼登入。');
    } else if (notice?.startsWith('error:')) {
      sessionStorage.removeItem('eclado_auth_notice');
      setView('login');
      setError(notice.slice(6));
    }
  }, []);

  // ── 登入 ──
  async function handleSignIn(e) {
    e.preventDefault(); reset(); setLoading(true);
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { setError(sbError(error.message)); return; }
      setPage('account');
    } catch(err) { setError('網路異常，請確認連線'); }
    finally { setLoading(false); }
  }

  // ── 註冊 ──
  async function handleRegister(e) {
    e.preventDefault(); reset();
    if (password !== confirm) { setError('兩次密碼不一致'); return; }
    setLoading(true);
    try {
      const normalizedEmail = email.trim().toLowerCase();
      const { data: existingProfile, error: profileCheckError } = await supabase
        .from('profiles')
        .select('id')
        .eq('email', normalizedEmail)
        .maybeSingle();
      if (profileCheckError) {
        console.warn('[ECLADO] 檢查會員是否存在失敗：', profileCheckError.message);
      }
      if (existingProfile) {
        setError('此 Email 已註冊會員，請直接登入或使用忘記密碼。');
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email: normalizedEmail, password,
        options: {
          data: { name, phone, role: 'consumer' },
          emailRedirectTo: getAuthRedirectUrl(),
        }
      });
      if (error) { setError(sbError(error.message)); return; }
      if (data?.user?.id) {
        await supabase.from('profiles').upsert({
          id: data.user.id,
          email: normalizedEmail, name, phone,
          role: 'consumer',
        });
      }
      if (data?.session) {
        setSuccess('✓ 會員已建立完成，請直接登入。');
      } else {
        setSuccess('✓ 驗證信已發送！請查收 ' + normalizedEmail + ' 並點擊驗證連結後再登入。若未收到，請檢查垃圾郵件或稍後再試一次。');
      }
      setView('login');
    } catch(err) { setError('網路異常，請確認連線'); }
    finally { setLoading(false); }
  }

  // ── 忘記密碼 ──

    e.preventDefault(); reset(); setLoading(true);

        redirectTo: getPasswordResetRedirectUrl(),

      if (error) { setError(sbError(error.message)); return; }
      setSuccess('✓ 密碼重設信已發送至 ' + email + '，請查收信箱。');

    finally { setLoading(false); }

      response_type: 'code',
      client_id: '2010106039',
      redirect_uri: lineRedirectUri,
      state,
      scope: 'profile openid email',
      bot_prompt: 'aggressive',
    });
    window.location.href = 'https://access.line.me/oauth2/v2.1/authorize?' + params;
  }

  const inputStyle = { width:'100%', border:'none', borderBottom:'1px solid var(--light)', padding:'9px 0', fontSize:15, fontFamily:'var(--font-body)', outline:'none', background:'none', color:'var(--dark)' };

        <div style={{ position:'relative', zIndex:1, textAlign:'center' }}>

        </div>

// ─── RESET PASSWORD PAGE ─────────────────────────────────────────────────────
function ResetPasswordPage({ setPage }) {
  const [password, setPassword] = useState('');
  const [confirm, setConfirm]   = useState('');
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState('');
  const [success, setSuccess]   = useState('');

  function reset() { setError(''); setSuccess(''); }

  async function handleResetPassword(e) {
    e.preventDefault(); reset();
    if (password.length < 6) { setError('密碼至少需要 6 個字元'); return; }
    if (password !== confirm) { setError('兩次密碼不一致'); return; }
    setLoading(true);
    try {
      const { error } = await supabase.auth.updateUser({ password });
      if (error) { setError(sbError(error.message)); return; }
      window.history.replaceState(null, '', window.location.pathname || '/');
      setPassword('');
      setConfirm('');
      setSuccess('✓ 密碼已更新，請使用新密碼重新登入。');
      await supabase.auth.signOut();
    } catch(err) { setError('重設連結已失效，請重新申請密碼重設信。'); }
    finally { setLoading(false); }
  }

  const inputStyle = { width:'100%', border:'none', borderBottom:'1px solid var(--light)', padding:'9px 0', fontSize:15, fontFamily:'var(--font-body)', outline:'none', background:'none', color:'var(--dark)' };

  return (
    <div style={{ minHeight:'100vh', display:'flex' }}>
      <div className="login-visual" style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', background:'var(--black)', padding:60, position:'relative', overflow:'hidden' }}>
        <img src="https://images.unsplash.com/photo-1571781926291-c477ebfd024b?w=900&q=85&fit=crop" alt="" style={{ position:'absolute', top:0, left:0, width:'100%', height:'100%', objectFit:'cover', opacity:0.35 }} />
        <div style={{ position:'relative', zIndex:1, textAlign:'center' }}>
          <div style={{ fontFamily:'var(--font-display)', fontSize:26, letterSpacing:'0.22em', color:'var(--white)', marginBottom:6 }}>ECLADO</div>
          <div style={{ fontSize:9, letterSpacing:'0.3em', color:'var(--gold)', marginBottom:40, textTransform:'uppercase' }}>Korean Cosmeceuticals</div>
          <p style={{ fontFamily:'var(--font-display)', fontSize:30, fontWeight:300, color:'var(--white)', lineHeight:1.4, marginBottom:20 }}>Reset<br />Password.</p>
          <p style={{ fontSize:13, color:'rgba(255,255,255,0.4)', lineHeight:1.9 }}>請設定新的會員密碼</p>
        </div>
      </div>

      <div style={{ width:'100%', maxWidth:480, display:'flex', flexDirection:'column', justifyContent:'center', padding:'60px 32px', background:'var(--white)', overflowY:'auto' }}>
        <BackHomeButton setPage={setPage} />

        <div style={{ marginBottom:28 }}>
          <div style={{ fontFamily:'var(--font-display)', fontSize:20, letterSpacing:'0.2em', color:'var(--black)', marginBottom:4 }}>ECLADO</div>
          <div style={{ fontSize:9, letterSpacing:'0.26em', color:'var(--gold)', textTransform:'uppercase' }}>Korean Cosmeceuticals</div>
        </div>

        <div style={{ marginBottom:28 }}>
          <h2 style={{ fontFamily:'var(--font-display)', fontSize:22, fontWeight:300, color:'var(--black)' }}>重設密碼</h2>
          <p style={{ fontSize:13, color:'var(--dark)', marginTop:8, lineHeight:1.7 }}>請輸入新的密碼，完成後可重新登入會員帳號。</p>
        </div>

        {success && (
          <div style={{ background:'#f0faf0', border:'1px solid #b7ddb7', padding:'14px 16px', marginBottom:20, fontSize:13, color:'#2d6a2d', lineHeight:1.7 }}>{success}</div>
        )}

        {error && (
          <div style={{ background:'#fff5f5', border:'1px solid #f5c0c0', padding:'14px 16px', marginBottom:20, fontSize:13, color:'#c0392b', lineHeight:1.7 }}>{error}</div>
        )}

        {!success && (
          <form onSubmit={handleResetPassword} style={{ display:'flex', flexDirection:'column', gap:22 }}>
            <div>
              <label style={{ fontSize:11, letterSpacing:'0.14em', color:'var(--dark)', textTransform:'uppercase', display:'block', marginBottom:9 }}>新密碼（至少 6 位）</label>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength={6} style={inputStyle}
                onFocus={e=>e.target.style.borderBottomColor='var(--dark)'}
                onBlur={e=>e.target.style.borderBottomColor='var(--light)'} />
            </div>
            <div>
              <label style={{ fontSize:11, letterSpacing:'0.14em', color:'var(--dark)', textTransform:'uppercase', display:'block', marginBottom:9 }}>確認新密碼</label>
              <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} required style={inputStyle}
                onFocus={e=>e.target.style.borderBottomColor='var(--dark)'}
                onBlur={e=>e.target.style.borderBottomColor='var(--light)'} />
            </div>
            <button type="submit" disabled={loading} style={{ width:'100%', background: loading ? 'var(--mid)' : 'var(--black)', color:'var(--white)', border:'none', padding:'15px', fontSize:12, letterSpacing:'0.2em', textTransform:'uppercase', cursor: loading ? 'default' : 'pointer', fontFamily:'var(--font-body)', fontWeight:500 }}>
              {loading ? '更新中...' : '更新密碼'}
            </button>
          </form>
        )}

        {success && (
          <button onClick={() => setPage('login')} style={{ width:'100%', background:'var(--black)', color:'var(--white)', border:'none', padding:'15px', fontSize:12, letterSpacing:'0.2em', textTransform:'uppercase', cursor:'pointer', fontFamily:'var(--font-body)', fontWeight:500 }}>
            前往登入
          </button>
        )}
      </div>
    </div>
  );
}
