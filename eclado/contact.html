<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聯絡我們 — ECLADO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:wght@200;300;400;500;600&family=Noto+Serif+TC:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --white: #fafaf9;
    --off-white: #f4f3f1;
    --light: #ebebea;
    --mid: #c8c7c5;
    --dark: #2a2a28;
    --black: #141412;
    --gold: #b8a98a;
    --font-display: 'Gilda Display', 'Noto Serif TC', Georgia, serif;
    --font-body: 'Jost', 'Noto Serif TC', Helvetica, sans-serif;
  }
  html { font-size: 16px; scroll-behavior: smooth; }
  body { background: var(--white); color: var(--dark); font-family: var(--font-body); font-weight: 300; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; height: 68px;
    background: var(--white); border-bottom: 1px solid var(--light);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; z-index: 100;
  }
  .nav-logo { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.22em; color: var(--black); text-decoration: none; }
  .nav-sub  { font-size: 8px; letter-spacing: 0.28em; color: var(--gold); text-transform: uppercase; margin-top: 2px; }
  .nav-back { font-size: 12px; color: var(--dark); text-decoration: none; letter-spacing: 0.08em; }
  .nav-back:hover { color: var(--black); }

  .hero {
    margin-top: 68px;
    background: var(--off-white);
    padding: 64px 32px 48px;
    border-bottom: 1px solid var(--light);
  }
  .hero-inner { max-width: 860px; margin: 0 auto; }
  .hero-label { font-size: 11px; letter-spacing: 0.28em; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
  .hero-title { font-family: var(--font-display); font-size: 44px; font-weight: 300; color: var(--black); margin-bottom: 12px; }
  .hero-desc  { font-size: 14px; color: var(--dark); line-height: 1.8; }

  .content { max-width: 860px; margin: 0 auto; padding: 64px 32px 96px; flex: 1; }

  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }

  .card {
    border: 1px solid var(--light);
    padding: 40px 36px;
    text-decoration: none;
    display: flex; flex-direction: column; gap: 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover { border-color: var(--dark); box-shadow: 0 4px 24px rgba(0,0,0,0.06); }

  .card-icon { width: 40px; height: 40px; }
  .card-name { font-family: var(--font-display); font-size: 22px; font-weight: 300; color: var(--black); }
  .card-desc { font-size: 13px; color: var(--dark); line-height: 1.8; }
  .card-cta  { font-size: 11px; letter-spacing: 0.14em; color: var(--dark); text-transform: uppercase; margin-top: 8px; }

  footer { background: var(--black); padding: 28px 32px; text-align: center; margin-top: auto; }
  footer p { font-size: 11px; color: rgba(255,255,255,0.25); line-height: 1.9; }

  @media (max-width: 640px) {
    nav { padding: 0 20px; }
    .hero { padding: 48px 20px 36px; }
    .hero-title { font-size: 30px; }
    .content { padding: 48px 20px 72px; }
    .cards { grid-template-columns: 1fr; gap: 16px; }
    .card { padding: 32px 24px; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    ECLADO
    <div class="nav-sub">Korean Cosmeceuticals</div>
  </a>
  <a href="/" class="nav-back">← 返回首頁</a>
</nav>

<div class="hero">
  <div class="hero-inner">
    <p class="hero-label">Contact</p>
    <h1 class="hero-title">聯絡我們</h1>
    <p class="hero-desc">有任何問題、諮詢或合作需求，歡迎透過以下方式與我們聯繫。</p>
  </div>
</div>

<div class="content">
  <div class="cards">

    <a href="mailto:ecladotaiwan@gmail.com" class="card">
      <!-- Email icon -->
      <svg class="card-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#141412"/>
        <rect x="9" y="13" width="22" height="15" rx="2" stroke="white" stroke-width="1.8" fill="none"/>
        <path d="M9 15l11 8 11-8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="card-name">電子郵件</div>
        <div class="card-desc">ecladotaiwan@gmail.com</div>
      </div>
      <div class="card-cta">發送郵件 →</div>
    </a>

    <a href="https://lin.ee/5RLUjni" target="_blank" rel="noopener noreferrer" class="card">
      <!-- LINE icon -->
      <svg class="card-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#00B900"/>
        <path d="M20 8C13.373 8 8 12.925 8 19c0 3.748 2.385 7.059 6 9.022l-.75 3.003 3.45-1.81c1.05.293 2.163.452 3.3.452 6.627 0 12-4.925 12-11s-5.373-11-12-11z" fill="white"/>
      </svg>
      <div>
        <div class="card-name">LINE 官方帳號</div>
        <div class="card-desc">產品諮詢、訂單問題、售後服務。</div>
      </div>
      <div class="card-cta">開啟 LINE →</div>
    </a>

    <a href="https://www.instagram.com/eclado_tw?igsh=MWt3OWl5OWd0dm1vMQ%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="card">
      <!-- Instagram icon -->
      <svg class="card-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="url(#ig-grad)"/>
        <rect x="11" y="11" width="18" height="18" rx="5" stroke="white" stroke-width="1.8" fill="none"/>
        <circle cx="20" cy="20" r="4.5" stroke="white" stroke-width="1.8" fill="none"/>
        <circle cx="25.5" cy="14.5" r="1.2" fill="white"/>
        <defs>
          <linearGradient id="ig-grad" x1="0" y1="40" x2="40" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f09433"/>
            <stop offset="0.25" stop-color="#e6683c"/>
            <stop offset="0.5" stop-color="#dc2743"/>
            <stop offset="0.75" stop-color="#cc2366"/>
            <stop offset="1" stop-color="#bc1888"/>
          </linearGradient>
        </defs>
      </svg>
      <div>
        <div class="card-name">Instagram</div>
        <div class="card-desc">追蹤最新產品資訊、保養知識與品牌動態。</div>
      </div>
      <div class="card-cta">前往 Instagram →</div>
    </a>

  </div>
</div>

<footer>
  <p>
    Zhao Cheng International Trading Co., Ltd. ｜ 統一編號：60490580<br>
    © 2026 ECLADO. All rights reserved.
  </p>
</footer>

</body>
</html>
