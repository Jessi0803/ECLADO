<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>確認您的 ECLADO 會員信箱</title>
</head>
<body style="margin:0; padding:0; background:#f4f3f1; color:#2a2a28; font-family:-apple-system,BlinkMacSystemFont,'Noto Serif TC','Microsoft JhengHei',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f3f1; margin:0; padding:36px 14px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; background:#fafaf9; border:1px solid #e5e1d8;">
          <tr>
            <td align="center" style="padding:34px 28px 20px;">
              <div style="font-family:Georgia,'Times New Roman','Noto Serif TC',serif; font-size:28px; letter-spacing:0.16em; color:#141412;">
                ECLADO
              </div>
              <div style="margin-top:10px; font-size:12px; letter-spacing:0.18em; color:#b8a98a;">
                KOREAN AESTHETIC SKINCARE
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding:0 34px;">
              <div style="height:1px; background:#e5e1d8;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:34px 34px 8px;">
              <h1 style="margin:0; color:#141412; font-family:Georgia,'Times New Roman','Noto Serif TC',serif; font-size:25px; font-weight:400; line-height:1.45; letter-spacing:0.04em;">
                歡迎加入 ECLADO
              </h1>
              <p style="margin:18px 0 0; color:#55534f; font-size:15px; line-height:1.9;">
                感謝您註冊 ECLADO 會員。請點擊下方按鈕完成 Email 驗證，啟用您的會員帳號。
              </p>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:26px 34px 18px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block; min-width:220px; padding:15px 26px; background:#141412; color:#ffffff; text-decoration:none; font-size:14px; line-height:1.4; letter-spacing:0.12em;">
                確認我的 Email
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding:6px 34px 32px;">
              <p style="margin:0; color:#77736c; font-size:13px; line-height:1.8;">
                如果按鈕無法開啟，請複製以下連結並貼到瀏覽器：
              </p>
              <p style="margin:10px 0 0; color:#77736c; font-size:12px; line-height:1.7; word-break:break-all;">
                {{ .ConfirmationURL }}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:0 34px;">
              <div style="height:1px; background:#e5e1d8;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 34px 34px;">
              <p style="margin:0; color:#8a867e; font-size:12px; line-height:1.8;">
                若您沒有註冊 ECLADO 會員，請忽略此封信件。此信由系統自動寄出，請勿直接回覆。
              </p>
              <p style="margin:16px 0 0; color:#b8a98a; font-size:12px; line-height:1.8; letter-spacing:0.08em;">
                ECLADO TAIWAN
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
