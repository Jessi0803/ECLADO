<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECLADO 重設會員密碼</title>
</head>

<body style="margin:0;padding:0;background:#f5f4f1;color:#282725;font-family:'Open Sans',Arial,'Noto Sans TC',sans-serif;">
  <table
    role="presentation"
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="width:100%;background:#f5f4f1;"
  >
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table
          role="presentation"
          width="100%"
          cellspacing="0"
          cellpadding="0"
          border="0"
          style="width:100%;max-width:600px;background:#ffffff;border-collapse:collapse;"
        >
          <!-- Logo -->
          <tr>
            <td align="center" style="background:#181817;padding:30px 24px;">
              <img
                src="https://ecladotaiwan.com/assets/images/ECLADO%20LOGO%20with%20CI_WHITE.png"
                width="168"
                alt="ECLADO Laboratory"
                style="display:block;width:168px;max-width:100%;height:auto;border:0;margin:0 auto;"
              >
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:42px 36px 36px;">
              <h1
                style="margin:0 0 22px;font-family:'Open Sans',Arial,'Noto Sans TC',sans-serif;font-size:24px;font-weight:400;line-height:1.45;color:#282725;text-align:center;"
              >
                重設會員密碼
              </h1>

              <p
                style="margin:0 0 16px;font-size:14px;font-weight:300;line-height:1.9;color:#4b4945;"
              >
                您好，我們收到您的 ECLADO 會員密碼重設申請。
              </p>

              <p
                style="margin:0 0 28px;font-size:14px;font-weight:300;line-height:1.9;color:#4b4945;"
              >
                請點擊下方按鈕前往密碼重設頁面，並設定新的會員密碼。
              </p>

              <!-- CTA button -->
              <table
                role="presentation"
                cellspacing="0"
                cellpadding="0"
                border="0"
                align="center"
                style="margin:0 auto 28px;"
              >
                <tr>
                  <td align="center" bgcolor="#181817">
                    <a
                      href="{{ .ConfirmationURL }}"
                      style="display:inline-block;padding:15px 34px;font-family:'Open Sans',Arial,'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;line-height:1;color:#ffffff;text-decoration:none;letter-spacing:1.5px;"
                    >
                      重新設定密碼
                    </a>
                  </td>
                </tr>
              </table>

              <p
                style="margin:0 0 8px;font-size:12px;font-weight:300;line-height:1.8;color:#8a867f;"
              >
                如果按鈕無法開啟，請複製以下網址並貼到瀏覽器：
              </p>

              <p
                style="margin:0;font-size:11px;line-height:1.7;color:#9a968e;word-break:break-all;"
              >
                {{ .ConfirmationURL }}
              </p>

              <div
                style="height:1px;background:#ece9e3;margin:32px 0 24px;"
              ></div>

              <p
                style="margin:0 0 10px;font-size:12px;font-weight:400;line-height:1.8;color:#5c5851;"
              >
                安全提醒
              </p>

              <p
                style="margin:0;font-size:12px;font-weight:300;line-height:1.8;color:#8a867f;"
              >
                若您沒有提出密碼重設申請，請忽略此封信件。您的原密碼不會因為收到此信而自動變更。
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td
              align="center"
              style="border-top:1px solid #ece9e3;padding:24px;font-size:11px;font-weight:300;line-height:1.9;color:#99958d;"
            >
              昭澄國際貿易有限公司<br>
              Zhao Cheng International Trading Co., Ltd.<br>
              <span style="color:#b0aca5;">
                Copyright © 2026 ECLADO. All rights reserved.
              </span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
